# Tenant Isolation Gate — versioned FALSE_POSITIVE allowlist (v6 W3.5)
#
# Per 25.09 audit W3: «Tenant gate должен работать по versioned allowlist
# и падать на unclassified findings. Per v6 §10: «Исключения хранятся в
# versioned allowlist с owner, причиной и сроком пересмотра».
#
# Файл загружается tools/checks/check_tenant_isolation.py через
# _load_tenant_allowlist() — каждый entry классифицируется как
# FALSE_POSITIVE вместо UNKNOWN candidate.
#
# v6 W3.5 (2026-09-25): initial allowlist для high-confidence
# infrastructure/system callsites которые НЕ являются user-data:
#
#   - infrastructure/repositories/base/* — base SQLAlchemy patterns
#     (CRUD operations на infrastructure таблицах, не user-data);
#   - infrastructure/repositories/outbox.py — transactional outbox pattern
#     (system event log, не tenant-scoped);
#   - infrastructure/workflow/pg_runner_internals/* — Temporal workflow
#     PG-backed instance/event stores (Temporal-managed, system-scope);
#   - infrastructure/security/cert_store/* — TLS cert store (system infra);
#   - services/scheduler/run_history.py — scheduler run history (job queue
#     metadata, system-scope per ADR-0346);
#   - infrastructure/observability/immutable_audit.py — audit log (system
#     append-only, не user-data);
#   - infrastructure/database/session_manager.py — DB session lifecycle;
#   - services/io/external_database/* — external DB dispatch (system catalog);
#   - dsl/engine/versioning.py, dsl/audit_versioning.py — DSL versioning
#     (system metadata, не user-data);
#   - dsl/engine/processors/batch.py — DSL batch processor (orchestration);
#   - repositories/rule_engine_repository.py — system rules;
#   - services/rpa/desktop_session_pool.py — RPA session pool (system);
#   - dsl/entrypoints/api/v1/endpoints/agent_memory.py — agent memory
#     (system-managed per-plugin);
#   - dsl/core/dsl/variable_backend.py — DSL variables (system);
#   - repositories/express_sessions_mongo.py — express session cache
#     (system-wide, не tenant-scoped).
#
# Format:
#   - file: relative путь от project root
#   - reason: human-readable объяснение почему НЕ user-data
#   - owner: владелец кода (team)
#   - review_date: ISO дата следующего пересмотра (max +6 months)
#   - added_at: ISO дата добавления
#
# Per audit W0: «Запретить новые optional tenant parameters AST-gate'ом.
# Каждый entry здесь — явный documented exception с review_date.
# НЕ добавлять entries для user-data API callsites без ADR».

