name: sensor_polling
version: "1.0"
description: |
  Sensor Polling — периодический опрос предиката до готовности.
  timeout_s обязателен: без него — SensorTimeoutRequiredError
  (D-A8-10, защита от бесконечного polling). Предикат получает payload
  активности (движок передаёт пустой dict `{}`) и возвращает bool;
  замените на свою проверку готовности.
  Template tags: sensor, polling, readiness, timeout.
tags:
  - sensor
  - polling
  - readiness
  - timeout
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: tech.check_redis
    timeout_s: 30
  # Предикат — action_id или module-level callable (`module.path:function_name`).
  #
  # ВАЖНО (волна 34): движок вызывает предикат как activity с ПУСТЫМ
  # payload (`execute_activity(predicate, {})`). Значит предикат не должен
  # зависеть от входных данных — он обязан проверять внешнее состояние.
  # Прежний пример `src.backend.dsl.helpers.banking:validate_inn` получал
  # `{}` вместо строки ИНН → validate_inn возвращал False → sensor всегда
  # доходил до таймаута (900 c) и workflow падал, а не опрашивал готовность.
  #
  # `tech.check_redis` — зарегистрированный action, возвращающий bool
  # (True, если Redis здоров): корректный предикат готовности.
  - type: sensor
    predicate: tech.check_redis
    poll_interval_s: 30
    timeout_s: 900
