# route.toml (V11): manifest for route 'jupyter_hub_run' (S170 NEW).
#
# ADR-0405: capability объявляются структурированно — [[route.capabilities]]
# с отдельными полями name/scope (ADR-0078/ADR-0366). Legacy-форма прятала
# scope внутрь имени ("jupyter.hub:run"), из-за чего имя capability не
# совпадало с vocabulary ("jupyter.hub" — двухсегментное <resource>.<verb>).
[route]
name = "jupyter_hub_run"
version = "0.1.0"
requires_core = ">=0.20,<0.21"
# Три pipeline (2026-10-06): раньше все три лежали в одном main.dsl.yaml,
# разделённые '---'; yaml.safe_load читает только ПЕРВЫЙ документ, поэтому
# run-file и run-inline молча терялись, а загрузка падала с
# "expected a single document in the stream". Разделено: один pipeline —
# один файл.
pipelines = [
    "run.dsl.yaml",
    "run_file.dsl.yaml",
    "run_inline.dsl.yaml",
]
tenant_aware = true
feature_flag = { enabled = true, gate = "jupyter_hub_enabled" }
slo = { p95_ms = 60000, timeout_ms = 600000 }
schedule = "never"

# Capability gate: выполнение ноутбуков на Jupyter Hub.
# ADR-044 grammar — ровно 2 сегмента <resource>.<verb>, поэтому исходное
# "jupyter.hub.run" объявляется как resource "jupyter.hub" + scope "run".
#
# ADR-0415: capability jupyter.hub остаётся НЕ публичной (запуск ноутбука =
# удалённое выполнение произвольного кода с сервисной учёткой), но теперь у
# неё есть владелец — расширение extensions/jupyter_hub/ объявляет
# [[capabilities]] name = "jupyter.hub", scope = "run" (ADR-0078). Роут
# запрашивает capability у провайдера через [route.requires_plugins], поэтому
# subset-инвариант ADR-044 (route.capabilities ⊆ union(requires_plugins) ∪
# public) выполняется и роут грузится.
#
# net.outbound — host Jupyter Hub из jupyter_hub.base_url (по умолчанию
# http://localhost:8000 → host "localhost"); runtime-гейт сверяет scope
# по hostname (core/net/outbound_http.py).
[[route.capabilities]]
name = "net.outbound"
scope = "localhost"

# jupyter.hub — verb запуска ноутбука; scope обязателен
# (vocabulary: scope_required=True для двухсегментных имён) и совпадает
# со scope, объявленным провайдером (extensions/jupyter_hub/plugin.toml).
[[route.capabilities]]
name = "jupyter.hub"
scope = "run"

# audit.write — семейство audit-sink'ов (vocabulary: scope = tenant-id,
# audit-sink или '*'). Шаги audit: пишут события роута.
[[route.capabilities]]
name = "audit.write"
scope = "audit:*"

# ВНИМАНИЕ (TOML): в конверте [route] bare-ключи обязаны идти ДО любой
# вложенной таблицы — иначе они поглощаются последней открытой таблицей.
# Провайдер capability jupyter.hub:run — extensions/jupyter_hub (ADR-0415).
[route.requires_plugins]
jupyter_hub = ">=0.1,<1.0"

[route.transport]
pool_size = 8
message_timeout_s = 600.0
default_timeout_s = 600.0

[route.feature_flags]
default = ["default"]
