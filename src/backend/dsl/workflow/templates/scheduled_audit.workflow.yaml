name: scheduled_audit
version: "1.0"
description: |
  Scheduled Audit — daily cron → collect events → aggregate → report.
  Template tags: scheduled, audit, daily, compliance.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: replay.list
    args:
      limit: 500
    timeout_s: 300
  - type: activity
    name: analytics.aggregate
    args:
      table: audit_events
      agg_func: count
      column: category
    timeout_s: 120
  - type: activity
    name: anomaly.stats
    args:
      metric: audit_events
    timeout_s: 60
  - type: activity
    name: export.to_csv
    args:
      rows: []
    timeout_s: 60
