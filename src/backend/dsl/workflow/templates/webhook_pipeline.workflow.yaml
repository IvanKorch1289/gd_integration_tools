name: webhook_pipeline
version: "1.0"
description: |
  Webhook Pipeline — webhook trigger → validate sig → process → respond.
  Template tags: webhook, integration, signature, hmac.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: webhook.transform
    args:
      payload: {}
      expression: body
    timeout_s: 10
  - type: activity
    name: connector.import
    args:
      payload: {}
    timeout_s: 30
  - type: activity
    name: notify.send
    args:
      channel: webhook
      to: "https://example.com/ack"
      subject: ack
      message: ok
    timeout_s: 5
