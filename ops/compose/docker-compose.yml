services:
  # ─── K-OPS-4 (S17): init-container `alembic upgrade head` ──────────
  # Запускается раз, до старта app/workflow-worker; читает alembic.ini
  # из корня репозитория, использует тот же образ что и app.
  # Использование: `docker compose up` поднимает migration-runner и
  # ждёт его успешного завершения через depends_on::
  # service_completed_successfully для app и workflow-worker.
  migration-runner:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic -c alembic.ini upgrade head || true"]
    environment:
      # S124 W4: dev profile (DB_HOST=postgres, REDIS_HOST=redis)
      # вместо prod (DB_HOST=postgres, REDIS_HOST=redis-prod) —
      # в docker-compose network нет redis-prod.
      APP_PROFILE: dev
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: dev
      DB_HOST: postgres
      APP_SERVER: ${APP_SERVER:-granian}
      APP_WORKERS: ${APP_WORKERS:-4}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MODE: ${CLAMAV_MODE:-tcp}
      # 2026-08-14: enable workflow YAML auto-loader
      # (FEATURE_WORKFLOW_YAML_ROUND_TRIP=true). Без этого
      # credit_assessment.workflow.yaml НЕ регистрируется в
      # workflow_registry → POST /api/v1/admin/workflows/trigger/*
      # возвращает «workflow not registered».
      FEATURE_WORKFLOW_YAML_ROUND_TRIP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # K-OPS-4: дождаться завершения миграций
      migration-runner:
        condition: service_completed_successfully
    restart: unless-stopped
    # cycle-9/D-AUDIT-903 fix: OOM-protection (consistent with k8s manifests).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  workflow-worker:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    # Worker entry-point: src.backend.infrastructure.workflow.worker.main() (см.
    # src/backend/infrastructure/workflow/worker.py:411). Раньше было
    # ``src.workflows.worker`` — модуль не существует, контейнер падал в
    # CrashLoopBackOff (worker не поднимал Temporal polling). K-OPS-4 fix.
    entrypoint: ["python", "-m", "src.backend.infrastructure.workflow.worker"]
    command: ["run"]
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: dev
      DB_HOST: postgres
      WORKFLOW_WORKER_EXECUTOR: ${WORKFLOW_WORKER_EXECUTOR:-dsl}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
      # NEW-9 (2026-08-14): workflow auto-load требует
      # FEATURE_WORKFLOW_YAML_ROUND_TRIP=true для парсинга workflow YAML.
      # Без этого worker вызывает start_workflow_runtime, но spec'и
      # не загружаются (FeatureDisabledError) → "spec not found" при execution.
      FEATURE_WORKFLOW_YAML_ROUND_TRIP: ${FEATURE_WORKFLOW_YAML_ROUND_TRIP:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # K-OPS-4: дождаться завершения миграций
      migration-runner:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_COUNT:-4}
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    # 2026-08-14 fix (D-AUDIT-20701): заменён ps-grep healthcheck
    # (FAILED — `ps` не установлен в slim image + `grep -v grep` semantics).
    # Worker слушает K8s probes на :9100 (WorkerProbesServer, см.
    # src/backend/infrastructure/workflow/worker_probes.py:79).
    # TCP check на :9100 — universal (binary в image есть `python -c`).
    # Override Dockerfile-baked healthcheck (cycle 198 → image re-bake deferred).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 9100), timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gd_integration}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # 2026-08-13 fix (variant A): host port 5432 conflict с локальным
    # /usr/lib/postgresql/16 (pid 1839). Сдвигаем host port на 5433 —
    # worker'ы ходят через compose-DNS `postgres:5432`, host port им
    # не нужен. Доступ из host-утилит (psql/pgAdmin): localhost:5433.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "300"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

volumes:
  pgdata:
  redisdata:
  clamav_db:
