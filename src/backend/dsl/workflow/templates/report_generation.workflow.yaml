name: report_generation
version: "1.0"
description: |
  Report Generation — schedule cron → fetch → aggregate → render → send.
  Template tags: reporting, scheduled, etl, render.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: orders.list
    args:
      limit: 1000
    timeout_s: 300
  - type: activity
    name: analytics.aggregate
    args:
      table: orders
      agg_func: count
      column: id
    timeout_s: 120
  - type: activity
    name: export.to_pdf
    args:
      rows: []
      title: monthly_summary
    timeout_s: 60
  - type: activity
    name: notify.email
    args:
      to: ops_team@example.com
      subject: monthly report
      message: "report attached"
    timeout_s: 30
