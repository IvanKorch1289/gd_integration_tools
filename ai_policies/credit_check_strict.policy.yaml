# AIPolicySpec v2 — credit_check workflow (M8 cleanup).
#
# M8: cleanup после S172 (Rebuff + Llama Guard removal). Старая версия
# содержала orphan references на удалённые провайдеры — PolicyResolver
# их silently skip, но это confusing для оператора.
#
# Применяется AIGateway.invoke() через PolicyResolver когда:
#   workflow_id matches "credit_check*" AND tenant_id matches "*"
#
# См. docs/adr/0067-ai-policy-spec-dsl.md.
# Примеры reference policies: rag_default.policy.yaml, agent_basic.policy.yaml.

name: credit_check_strict
version: 2  # bumped from 1 (M8: removed orphan rebuff/llama_guard refs)
workflow_pattern: "credit_check*"
tenant_pattern: "*"

model_router:
  primary: "openrouter/anthropic/claude-3.5-sonnet"
  fallback:
    - "openrouter/openai/gpt-4o-mini"
  timeout_s: 30.0
  retry_attempts: 2

# Шаг 3 AIGateway pipeline: input sanitizers (PII reversible mask).
input_sanitizers:
  - name: "pii_tokenizer:reversible:ru_strict"
    config:
      entity_types:
        - PERSON
        - PHONE_NUMBER
        - INN
        - SNILS
        - PASSPORT_RF
        - CONTRACT
      ttl_s: 1800
    on_error: "fail"

# Шаг 4 AIGateway pipeline: input guards.
# M8: removed ``rebuff:default`` (Rebuff archived in S172). Остался
# NeMo topic filter для banking compliance.
input_guards:
  - name: "nemo:colang:topics"
    config:
      allowed_topics: ["finance", "credit", "banking"]
      blocked_topics: ["politics", "religion"]
    on_block: "fail"

# Шаг 7 AIGateway pipeline: output guards.
# M8: removed ``llama_guard:safe_v3`` (LLM Guard archived in S172).
# Use LakeraGuard (third-party) для banking output safety.
output_guards:
  - name: "lakera:default"
    config:
      categories: ["pii", "toxic", "off_topic"]
      threshold: 0.7
    on_block: "dlq"

# Шаг 8 AIGateway pipeline: output sanitizers.
output_sanitizers:
  - name: "presidio:ru_anonymize"
    on_error: "warn"

# MemoryProtocol (ADR-NEW-18, S24 W3).
# M8: убрал mem0+pgvector (не реализован в LangMemService —
# использует Postgres для short-term, Qdrant для long-term).
# Убрал langgraph+postgres checkpointer (LangMem пока использует
# in-memory checkpointer; добавление требует отдельного WIP).
memory:
  short_term:
    backend: "redis"
    namespace: "credit:short:{tenant_id}:{session_id}"
    ttl: 3600
  long_term:
    backend: "qdrant"
    namespace: "credit:long:{tenant_id}"
    ttl: 2592000
  checkpointer: null  # M8: см. docstring выше
  tenant_isolation: true
  encryption: true

budget:
  max_tokens_prompt: 4000
  max_tokens_completion: 1000
  max_cost_usd: 0.25
  ttl_s: 1800

audit:
  extra_attrs:
    compliance: "152-FZ"
    domain: "banking_credit"
  schema_version: 2  # bumped for v2 fields

required: true
