from:
  http:
    method: POST
    path: /api/v1/demo/echo
steps:
  # P2-D8 (audit 2026-08-18): feature flag gate для demo-route.
  # Если ``demo_routes_enabled`` выключен — skip silently (200 с skipped status).
  - feature_flag:
      flag: demo_routes_enabled
      default: true
      stop_on_disabled: false
      output_field: demo_routes_active
  - validate_request:
      schema:
        type: object
        properties:
          message: { type: string }
        required: [message]
  - transform:
      set: { body.echoed: "${body.message}", body.length: "${len(body.message)}" }
to:
  response:
    code: 200
    body:
      echoed: ${body.echoed}
      length: ${body.length}
      flag_active: ${properties.demo_routes_active}
