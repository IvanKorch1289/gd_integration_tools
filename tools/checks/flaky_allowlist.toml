# Flaky test allowlist (Sprint 10 — audit 2026-09-22 P2).
#
# Каждый xfail test в tests/ должен иметь entry здесь с:
#   owner: email ответственного (для ping при expiry)
#   issue: ticket URL (JIRA, GitHub) для отслеживания root cause
#   expires: ISO 8601 date — после этой даты CI должен fail
#   reason: краткое описание почему test flaky
#
# CI gate (tools/checks/check_flaky_test_budget.py --strict):
#   - exit 1 если xfail без entry
#   - exit 1 если entry expired
#
# Workflow: при добавлении entry — owner ОБЯЗАН указать expiry ≤ 30 дней.
# При приближении expiry — owner пересматривает и либо fix'ит test
# (тогда entry удаляется), либо продлевает с новой expiry.

[meta]
policy_version = "1.0.0"
max_expiry_days = 30  # Owner не может установить expiry > 30 дней.
created = "2026-09-22"
policy = """
Quarantine contract:
1. Each xfail test must have an allowlist entry within 7 days of being added.
2. Owner must respond within 14 days of expiry ping.
3. Tests cannot remain quarantined > 90 days without explicit waiver.
4. CI is the single source of truth for flaky-test budget.
"""

