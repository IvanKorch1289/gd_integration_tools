name: ml_training_pipeline
version: "1.0"
description: |
  ML Training Pipeline — data prep → train → eval → register model with retry.
  Template tags: ml, training, model-registry, retry.
default_retry_policy:
  initial_interval_s: 2.0
  backoff_coefficient: 2.0
  maximum_interval_s: 60.0
  max_attempts: 3
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: analytics.query
    args:
      sql: "SELECT * FROM training_data"
    timeout_s: 300
  - type: activity
    name: ai.run_agent
    args:
      prompt: train model
      tools: []
    timeout_s: 3600
  - type: activity
    name: analytics.aggregate
    args:
      table: ml_metrics
      agg_func: avg
      column: score
    timeout_s: 180
  - type: activity
    name: notebooks.create
    args:
      title: ml_model
      content: "{}"
      created_by: mlops
      tags: [mlflow]
    timeout_s: 60
