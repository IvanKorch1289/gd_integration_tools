# Workflow DSL: credit_assessment (schema updated to S176+)
#
# Кредитная оценка по запросу SKB-Техно + НБКИ + scoring правила.
# Schema updated: top-level activities/compensation → steps[] (B-101 fix).
# D-AUDIT-B-101 fix: call_function refs указывают на module-level
# fetch_result (skb.py:152) и apply_rules (normalize.py).
name: credit_assessment
version: "1.0"
description: Кредитная оценка по запросу SKB-Техно + НБКИ + scoring правила.

steps:
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      body:
        applicant_id: "${{ applicant_id }}"
        loan_amount: "${{ loan_amount }}"
        term_months: "${{ term_months }}"
    timeout_s: 30
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      body:
        applicant_id: "${{ applicant_id }}"
        loan_amount: "${{ loan_amount }}"
        term_months: "${{ term_months }}"
    timeout_s: 30
  - type: activity
    name: extensions.credit_pipeline.functions.normalize:apply_rules
    args:
      responses:
        skb: "${{ steps.0 }}"
        nbki: "${{ steps.1 }}"
    timeout_s: 5
