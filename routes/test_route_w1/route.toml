# route.toml (V11): manifest for route 'test_route_w1' (S33 W1 wizard).
#
# ADR-0405: capability объявляются структурированно — [[route.capabilities]]
# с отдельными полями name/scope (ADR-0078/ADR-0366). Плоская форма
# capabilities = [...] молча теряла scope (scope=None), а
# CapabilityVocabulary.validate_ref отвергает scope=None для capability с
# scope_required=True → CapabilityGate.declare бросал ValueError, и роут
# не загружался вовсе ("capability_error: Capability 'net.outbound' requires
# explicit scope"). Дефект был замаскирован выключенным feature-flag.
[route]
name = "test_route_w1"
version = "0.1.0"
requires_core = ">=0.20,<0.21"
pipelines = ["main.dsl.yaml"]
tenant_aware = true
feature_flag = { enabled = true, gate = "test_route_w1_enabled" }
slo = { p95_ms = 500, timeout_ms = 5000 }
schedule = "never"

# db.write удалён 2026-10-06 (least privilege): в пайплайне нет ни одного
# шага записи в БД (crud_*/db_query*/db_persist*/db_call_procedure) —
# capability была объявлена, но не использовалась.
# db_call_procedure в списке — потому что шаг существует, но по умолчанию
# выключен флагом features.db_call_procedure_enabled (default-OFF,
# ADR-0380/ADR-0389): с выключенным флагом шаг был бы пропущен (skipped),
# поэтому он и не используется. Включение — только явным решением в профиле.

# net.outbound — внешний sink шага http_call (main.dsl.yaml:
# https://api.test/sink). Runtime-гейт сверяет scope по hostname
# (core/net/outbound_http.py → CapabilityGate.check(plugin, "net.outbound",
# host)), поэтому scope — хост, а не полный URL.
[[route.capabilities]]
name = "net.inbound"
scope = "http:/api/v1/*"
[[route.capabilities]]
name = "net.outbound"
scope = "api.test"

# audit.write — семейство audit-sink'ов (vocabulary: scope = tenant-id,
# audit-sink или '*'). Шаг audit: пишет событие роута.
[[route.capabilities]]
name = "audit.write"
scope = "audit:*"

[route.feature_flags]
default = ["default"]
