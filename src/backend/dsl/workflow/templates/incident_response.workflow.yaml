name: incident_response
version: "1.0"
description: |
  Incident Response — detect → triage → notify → mitigate (HITL approve).
  Template tags: ops, incident, alerting, hitl.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: anomaly.list_metrics
    timeout_s: 60
  - type: activity
    name: anomaly.stats
    args:
      metric: cpu
    timeout_s: 30
  - type: activity
    name: notify.telegram
    args:
      to: "@oncall"
      subject: incident
      message: anomaly detected
    timeout_s: 30
  - type: wait_signal
    signal_name: incident_approved
    timeout_s: 1800
  - type: activity
    name: tech.check_all_services
    timeout_s: 120
