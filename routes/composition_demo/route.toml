[route]
name = "composition_demo"
version = "0.1.0"
description = "Reference route demonstrating include:/extends: composition (S19 K3 W2)"
requires_core = ">=0.20,<0.21"
tenant_aware = false

pipelines = ["main.dsl.yaml"]

# ADR-044: capability объявляется таблицей name+scope (компактная строка
# "name:scope" не подходит — сегменты схемы/пути дают имя из 3 сегментов,
# что нарушает грамматику <resource>.<verb>).
[[route.capabilities]]
name = "net.inbound"
scope = "http:/api/v1/composition/demo"

[[route.capabilities]]
name = "net.outbound"
scope = "http://localhost:9000:internal"

[route.slo]
p95_ms = 30
p99_ms = 100
rps_target = 200

[route.feature_flag]
name = "route_composition_include"
