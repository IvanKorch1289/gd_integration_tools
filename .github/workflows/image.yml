name: image

# Sprint 6 Devops: container image pipeline — buildx + cosign + Trivy + GHCR.
# Single-arch (linux/amd64); multi-arch — вне scope.
#
# ДВЕ ветки pipeline (аудит 2026-11-23, ЭТАП 1):
#
#   Ревью (pull_request, merge_group, workflow_dispatch) — только build + scan:
#       build ──► scan (локальный образ)
#   Публикация (push в master, тег v*.*.*):
#       build_release ──► scan_release ──► sign ──► verify ──► promote
#           │                 │             │        │          └─ выдача
#           │                 │             │        └─ проверка подписи
#           │                 │             └─ cosign sign
#           │                 └─ Trivy по digest'у из registry
#           └─ buildx build + push ПО DIGEST (без пользовательских тегов)
#
# Почему так:
#   * push идёт ДО sign: cosign подписывает МАНИФЕСТ в registry — подписать
#     ещё не запушенный образ невозможно (старый порядок «sign → push» падал
#     на «no such manifest» и блокировал публикацию целиком);
#   * пользовательские теги (master/latest/sha-*/semver) выдаются ТОЛЬКО в
#     job'е promote — до verify ни один тег в registry не появляется;
#   * скан идёт по digest'у, который затем подписывается и публикуется:
#     сканируется ровно тот артефакт, который уходит в registry (раньше
#     push пересобирал образ, и просканированные байты не совпадали с
#     опубликованными);
#   * merge_group и pull_request не публикуют ничего: временный merge-коммит
#     merge queue не должен получать теги в registry.
#
# Идентичность подписи: verify сверяет Subject сертификата с ЯКОРНЫМ
# regex (репозиторий + конкретный workflow + ref), а не с «любой репозиторий
# на github.com» — иначе подпись чужого workflow принималась бы за нашу.
#
# Идемпотентность: GHA cache (type=gha) в buildx; cosign keyless (OIDC) —
# без long-lived секретов в репо.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  merge_group:
    # Merge queue: обязательные workflow должны идти и на merge_group,
    # иначе release-gate на merge_group не находит прогонов и падает
    # структурно (аудит 2026-11-23, независимое ревью: MAJOR-1).
  workflow_dispatch:

# Права по умолчанию. ВНИМАНИЕ: права уровня job ЗАМЕНЯЮТ этот блок,
# а не дополняют его — фактические права каждого job'а объявлены у него
# (см. tests/unit/deploy/test_image_workflow.py: test_job_permissions_*).
permissions:
  contents: read          # checkout
  packages: write         # push в ghcr.io
  id-token: write         # cosign keyless (OIDC ↔ Fulcio)
  security-events: write  # SARIF upload в Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Исходное имя репозитория. ВНИМАНИЕ: использовать его напрямую в
  # docker-ссылках нельзя — владелец «IvanKorch1289» приходит со смешанным
  # регистром, а docker/distribution отвергает такие ссылки
  # («repository name must be lowercase»). Нормализация — шаг
  # «Resolve image name» (см. ниже), результат идёт в steps.imagename.
  REPOSITORY: ${{ github.repository }}
  # ЯКОРНЫЙ regex Subject'а сертификата cosign (keyless, GitHub OIDC):
  #   https://github.com/<owner>/<repo>/.github/workflows/image.yml@<ref>
  # Владелец в claim'ах GitHub сохраняет исходный регистр ("IvanKorch1289"),
  # поэтому класс символов допускает оба варианта написания. Реальный
  # Subject офлайн не проверен (в окружении нет OIDC/cosign) — см. отчёт
  # аудита: ENV_BLOCKED.
  COSIGN_IDENTITY_REGEXP: >-
    ^https://github\.com/[Ii][Vv][Aa][Nn][Kk][Oo][Rr][Cc][Hh]1289/gd_integration_tools/\.github/workflows/image\.yml@refs/(heads/master|tags/v[0-9A-Za-z.+-]+)$

jobs:
  # ── Ветка ревью (pull_request, merge_group): build + scan ────────────────
  build:
    name: "Build (review: локальный образ)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Публикации на ревью нет: ни тегов, ни подписей (нет права писать в
    # registry, а merge-коммит merge queue публиковать нельзя).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      image: ${{ steps.ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: imagename
        # Имя в ghcr.io обязано быть lowercase: иначе docker/distribution
        # отвергает ссылку (invalid reference format). Владелец репозитория
        # — «IvanKorch1289», поэтому github.repository приходит со смешанным
        # регистром, и нормализация обязательна.
        env:
          REPO: ${{ env.REPOSITORY }}
        run: |
          echo "name=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imagename.outputs.name }}
          # Локальная сборка ревью: одного sha-тега достаточно, он не
          # публикуется и нужен только для сканирования.
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Resolve image ref
        id: ref
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          primary="$(printf '%s\n' "$IMAGE_TAGS" | grep -v '^[[:space:]]*$' | head -n 1)"
          if [ -z "${primary}" ]; then
            echo "::error::docker/metadata-action не вернул ни одного тега"
            exit 1
          fi
          echo "ref=${primary}" >> "$GITHUB_OUTPUT"

      - name: Build (load to local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save image artifact
        # Артефакт нужен, чтобы job scan просканировал РОВНО те байты,
        # которые собраны (пересборка даёт другие таймстемпы слоёв).
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p /tmp/image-artifact
          docker save "${IMAGE_REF}" | zstd -q -o /tmp/image-artifact/image.tar.zst
          ls -lh /tmp/image-artifact/image.tar.zst

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-artifact
          path: /tmp/image-artifact/image.tar.zst
          retention-days: 1
          if-no-files-found: error

  scan:
    name: "Scan (review: Trivy, локальный образ)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        # Нужен для fingerprint'ов файлов в SARIF (source-root в Security tab).
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-artifact
          path: /tmp/image-artifact

      - name: Load image into Docker
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          zstd -q -d -c /tmp/image-artifact/image.tar.zst | docker load
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}'

      - name: Run Trivy image scan
        # Вход action'а — `image-ref` (в `image` удалён из trivy-action):
        # GitHub отбрасывал неизвестный вход, и trivy получал scan-ref
        # по умолчанию '.' → «could not parse reference: .».
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ── Ветка публикации (push в master / тег v*.*.*) ────────────────────────
  build_release:
    name: "Build (release: push по digest)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      # Имя образа — нормализованное (lowercase), иначе registry его отвергнет.
      image: ${{ env.REGISTRY }}/${{ steps.imagename.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: imagename
        # Имя в ghcr.io обязано быть lowercase: иначе docker/distribution
        # отвергает ссылку (invalid reference format). Владелец репозитория
        # — «IvanKorch1289», поэтому github.repository приходит со смешанным
        # регистром, и нормализация обязательна.
        env:
          REPO: ${{ env.REPOSITORY }}
        run: |
          echo "name=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imagename.outputs.name }}
          # Пользовательские теги выдаются ТОЛЬКО в job'е promote — после
          # скана и проверки подписи.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push by digest
        # PUSH ПО DIGEST: в registry попадает манифест без пользовательских
        # тегов — до verify ни один тег не существует. Именно этот digest
        # затем сканируется, подписывается и публикуется под тегами.
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.imagename.outputs.name }},push-by-digest=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

  scan_release:
    name: "Scan (release: Trivy по digest'у)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build_release
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        # Нужен для fingerprint'ов файлов в SARIF (source-root в Security tab).
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        # Сканируется ТОТ ЖЕ digest, который затем подписывается и
        # публикуется: иначе «просканирован» был бы один образ, а в
        # registry ушёл бы другой.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build_release.outputs.image }}@${{ needs.build_release.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  sign:
    name: Sign (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Подпись ПОСЛЕ push: cosign подписывает манифест в registry — того, что
    # ещё нет, подписать нельзя.
    needs: [build_release, scan_release]
    if: github.event_name == 'push'
    permissions:
      contents: read
      # packages: write — cosign keyless КЛАДЁТ подпись в registry, это
      # отдельная запись в OCI (нужен write, не только read).
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ needs.build_release.outputs.image }}
          DIGEST: ${{ needs.build_release.outputs.digest }}
        run: |
          cosign sign --yes \
            --output-signature image.sig \
            --output-certificate image.pem \
            "${IMAGE_REF}@${DIGEST}"

      - name: Upload signature artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosign-signature-${{ github.ref_name }}
          path: |
            image.sig
            image.pem
          retention-days: 30
          if-no-files-found: warn

  verify:
    name: Verify signature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Проверка ПОДПИСИ запушенного digest с ЯКОРНЫм identity: принимается
    # только подпись ЭТОГО репозитория, ЭТОГО workflow и ЭТОГО ref.
    # Прежний regex «https://github.com/.*/.*» принимал подпись любого
    # репозитория на github.com (независимое ревью 2026-11-23).
    needs: [build_release, sign]
    if: github.event_name == 'push'
    permissions:
      contents: read
      # packages: read — verify тянет манифест и подпись из registry.
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ needs.build_release.outputs.image }}
          DIGEST: ${{ needs.build_release.outputs.digest }}
          IDENTITY_REGEXP: ${{ env.COSIGN_IDENTITY_REGEXP }}
        run: |
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}@${DIGEST}"

  promote:
    name: Promote (выдача тегов)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Пользовательские теги (master/latest/sha-*/semver) выдаются ТОЛЬКО
    # здесь — то есть ПОСЛЕ скана и проверки подписи. До этого момента в
    # registry лежит только манифест по digest, без тегов.
    needs: [build_release, verify]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote digest to tags
        env:
          IMAGE_REF: ${{ needs.build_release.outputs.image }}
          DIGEST: ${{ needs.build_release.outputs.digest }}
          IMAGE_TAGS: ${{ needs.build_release.outputs.tags }}
        run: |
          set -euo pipefail
          source="${IMAGE_REF}@${DIGEST}"
          echo "Promote ${source}"
          while IFS= read -r tag; do
            if [ -z "${tag}" ]; then
              continue
            fi
            case "${tag}" in
              *@*) continue ;;
            esac
            echo "  -> ${tag}"
            # --prefer-index=false: копия исходного манифеста «как есть».
            # Со значением по умолчанию (true) для ОДНОГО манифеста buildx
            # создаёт НОВЫЙ index — digest тега перестал бы совпадать с
            # подписанным digest'ом.
            docker buildx imagetools create --prefer-index=false --tag "${tag}" "${source}"
          done <<< "${IMAGE_TAGS}"
