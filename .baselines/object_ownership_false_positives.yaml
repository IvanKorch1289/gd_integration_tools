    owner: gd_integration_tools/dsl
    review_date: "2027-03-24"
    added_at: "2026-09-24"

  - file: src/backend/dsl/workflow/bpmn_importer.py
    line: 362
    reason: >
      ``elements.get(node_id)`` — поиск элемента в ЛОКАЛЬНОЙ карте разобранного
      BPMN-XML ({id: element}, собирается _collect_elements(process) из
