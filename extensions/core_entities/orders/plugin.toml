# V11 plugin manifest — extensions/core_entities/orders
# Sprint 7 (R-V15-16): миграция CRUD-ресурса Order из ядра в extensions/.
#
# Формат: ADR-042 (plugin.toml schema), ADR-044 (capability vocabulary).

name = "core_entities_orders"
version = "1.0.0"
requires_core = ">=0.2,<0.3"
entry_class = "extensions.core_entities.orders.plugin.OrdersPlugin"
tenant_aware = false
description = "Order CRUD plugin (migrated from src/backend/services/core/orders.py per R-V15-16)"
# S18 W12 (ADR-NEW-6): core entities (internal trusted) → Tier-A.
trust_tier = "A"

# ─── Runtime capabilities (capability-gate) ───────────────────────
# Cycle-17 (D-AUDIT-1701): ранее здесь было два ``db.read`` (scope='orders' +
# scope='orderkinds'). CapabilityGate.declare использует ``ref.name`` (без scope)
# как bucket-key (declaration_mixin.py:62-66) и reject'ит дубликаты — второй
# был silently dropped (см. test_core_entities_capability xfail в pre-cycle-17).
#
# FK на orderkinds реализован через ``relationship("OrderKind", lazy="joined")``
# в ``extensions/core_entities/orders/domain/models.py:74`` — JOIN не
# триггерит отдельный capability check, поэтому отдельная декларация
# не нужна. Если в будущем понадобится validate_order_kind через отдельный
# SELECT — добавить новый capability (например ``db.cross.read``).
[[capabilities]]
name = "db.read"
scope = "orders"

[[capabilities]]
name = "db.write"
scope = "orders"

# ─── Декларативный inventory ──────────────────────────────────────
[provides]
repositories = ["orders"]
schemas = ["OrderSchemaIn", "OrderSchemaOut", "OrderVersionSchemaOut"]
