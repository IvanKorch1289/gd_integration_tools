# ──────────────────────────────────────────────────────────────────────
# staging.yml — overlay для предпродакшн-окружения.
#
# Все хосты/порты/секреты приходят извне (env / Vault) — здесь только
# staging-специфичные значения, которые отличаются от base.yml. Файл
# обязан быть самодостаточным после deep-merge с base.yml.
# ──────────────────────────────────────────────────────────────────────

app:
  environment: "staging"
  debug_mode: false
  host: "0.0.0.0"
  port: 8000
  use_ssl: true
  # ADR-0371 (cycle 172): staging — не однопроцессный dev-режим
  # (в base.yml ``workers=1``). 2 воркера: меньше prod'а (4), но стенд
  # всё равно должен воспроизводить многопроцессный режим.
  workers: 2
  granian_runtime_threads: 2
  opentelemetry_endpoint: "http://otel-collector:4317"
  telemetry_enabled: true
  admin_enabled: true
  monitoring_enabled: true
  # ADR-0371 (cycle 172): API-документация в staging закрыта, как в prod
  # (в base.yml было ``enable_swagger: true``).
  enable_swagger: false
  enable_redoc: false


# ADR-0371 (cycle 172): интроспекция GraphQL выключена (см. base.yml).
graphql:
  enable_introspection: false


# ADR-0371 (cycle 172): TLS-проверка исходящих запросов — как в prod
# (в base.yml было ``ssl_verify: false``, сертификаты не проверялись).
#
# ADR-0377: limit_per_host приведён к prod-уровню (в base.yml осталось
# dev-значение 20 — пул соединений на внешний хост был dev-ограничен).
http:
  ssl_verify: true
  limit_per_host: 50


security:
  # ADR-0377: rate_limit / request_timeout — prod-уровень (в base.yml
  # остались dev-значения 1000 / 20.0): стенд должен воспроизводить
  # prod-нагрузку, иначе отказы внешних интеграций не воспроизводятся.
  rate_limit: 3000
  request_timeout: 30.0
  admin_ips: []
  admin_routes:
    - "/admin"
    - "/admin/*"
    - "/metrics"
  allowed_hosts:
    - "*.staging.local"


# ADR-0377: Vault в staging больше не наследует loopback-plaintext из
# base.yml (``http://127.0.0.1:8200``) — как в prod, но со staging-DNS.
# Реальный адрес задаётся env ``VAULT_ADDR`` (приоритет выше YAML).
vault:
  addr: "https://vault-staging:8200"


# ADR-0371 (cycle 172): feature-флаги объявлены явно — без этой секции
# работали модельные дефолты ``lsp_server_strict=True`` и
# ``ai_prompt_sweep_strict=True``, а ``ConfigValidator`` на merged-конфиге
# staging давал два CRITICAL (``feature_flag.dependency_unmet``):
# strict-флаги требуют несуществующих базовых флагов ``lsp_server`` /
# ``ai_prompt_sweep`` (S46: documented no-ops).
features:
  lsp_server_strict: false
  ai_prompt_sweep_strict: false
  # ADR-0063 (Accepted) — Presidio + ru NER PII layer обязателен в prod;
  # staging повторяет prod-конфигурацию.
  presidio_pii_enabled: true


# ADR-0371 (cycle 172): WAF в staging — strict, как в prod (в base.yml
# секции ``waf:`` не было: ``strict=false`` + пустой allowlist → все
# исходящие запросы проходили без фильтрации).
# allow_hosts — тот же whitelist, что в prod (esbgreendata + loopback
# sidecar'ы); owner-задача — заменить loopback на service-DNS имена.
#
# ADR-0377: добавлены хосты ВНЕШНИХ интеграций
# (src/backend/services/integrations/**): при strict=true исходящий запрос
# к хосту вне allowlist'а блокировался (WafBypassError) — запросы к
# СКБ-Техно и DaData идут напрямую (минуя WAF-шлюз http.waf_url).
waf:
  strict: true
  allow_hosts:
    - "esbgreendata"
    - "localhost"
    - "127.0.0.1"
    # СКБ-Техно (services/integrations/skb.py → skb.prod_url)
    - "api.skb-techno.ru"
    # DaData (services/integrations/dadata.py → dadata.base_url)
    - "suggestions.dadata.ru"


# B-12 fix (cycle 37) + cycle 38 Task #1: pre-production enforcement policy
# engines (OPA + Casbin). engine_enabled=True обязывает composition root
# инстанцировать runtime policy-цепочку. На staging это позволяет заранее
# валидировать rego-пакеты и Casbin-модель до prod-релиза. dev/dev_light
# остаются выключенными (default OFF в base.yml).
#
# ADR-0377: здесь — ТОЛЬКО литералы. YAML-загрузчик не подставляет
# переменные окружения (Helm эти файлы не шаблонизирует), поэтому
# плейсхолдер ${OPA_URL:-...} попадал в рантайм как есть. Переопределение —
# через env (приоритет выше YAML, ADR-0372):
#   POLICY_OPA_URL, POLICY_CASBIN_MODEL_PATH, POLICY_CASBIN_POLICY_PATH
# (префикс POLICY_ — см. core/config/services/policy.py::PolicySettings).
policy:
  engine_enabled: true
  opa_url: "http://opa-staging:8181"
  opa_policy_name: "authz/default"
  casbin_model_path: "/etc/casbin/model.conf"
  casbin_policy_path: "/etc/casbin/policies.csv"


database:
  type: "postgresql"
  host: "postgres-staging"
  port: 5432
  name: "main_db"
  ssl_mode: "require"
  ca_bundle: null
  # Sprint 6 K2: staging pool tuning — половина prod-объёма.
  pool_size: 15
  max_overflow: 10
  pool_recycle: 1800
  pool_timeout: 15
  pool_pre_ping: true
  pool_use_lifo: true


external_databases:
  ssl_mode: "require"
  ca_bundle: null
  connections: []
  pool_size: 8
  max_overflow: 5
  pool_pre_ping: true


redis:
  enabled: true
  host: "redis-staging"
  port: 6379
  db_cache: 2
  db_queue: 3
  db_limits: 4
  db_tasks: 5
  use_ssl: true
  ca_bundle: null
  socket_keepalive: true
  main_stream: "events_stream"
  dlq_stream: "events_dlq"

  # S48 W3 fix (см. dev.yml): invoker_subscribers.py eagerly резолвит
  # get_stream_name("invocations-in") на module load; без записи стрим
  # fail-closed валит app_factory («Не настроен поток для ключа:
  # invocations-in») — профиль незагружаем. Зеркало dev-фикса владельца.
  streams:
    - {name: "invocations-in", value: "invocations-in-stream"}
    - {name: "actions", value: "actions-stream"}
    - {name: "dsl-actions", value: "dsl-actions-stream"}
    - {name: "dsl-events", value: "dsl-events-stream"}
    - {name: "email", value: "email-notification-stream"}
    - {name: "order-send", value: "order-send-to-skb-stream"}
    - {name: "order-get-result", value: "order-get-result-from-skb-stream"}
    - {name: "order-pipeline", value: "order-start-pipeline_stream"}



mongo:
  enabled: true
  host: "mongo-staging"
  port: 27017
  name: "mongo"


queue:
  enabled: true
  type: "rabbitmq"
  host: "rabbitmq-staging"
  port: 5672
  ui_port: 15672
  use_ssl: true
  ca_bundle: null


  # S48 W3 fix (см. dev.yml queue.queues): invoker_subscribers.py:49
  # eagerly резолвит get_queue_name("invocations-in") на module load.
  # База (order-create/order-send) не содержит нужных ключей —
  # оверлей заменяет список целиком, поэтому базовые очереди повторены.
  queues:
    - {name: "invocations-in", value: "invocations-in-queue"}
    - {name: "dsl-actions", value: "dsl-actions-queue"}
    - {name: "order-create", value: "order-init-create-queue"}
    - {name: "order-send", value: "order-send-queue"}

mail:
  host: "smtp-staging"
  port: 587
  sender: "noreply@staging.local"
  use_tls: true
  validate_certs: true
  ca_bundle: null
  template_folder: null


log:
  host: "graylog-staging"
  port: 9000
  use_tls: true
  ca_bundle: null
  # Wave 13 Q1: явный INFO — base.yml задаёт log.level=DEBUG для всех профилей,
  # без override staging логировался на DEBUG.
  level: "INFO"
  # ADR-0371 (cycle 172): per-request body-логирование выключено, как в prod
  # (в base.yml было ``log_requests: true``) — InnerRequestLoggingMiddleware
  # буферизует и логирует body каждого response, это главный cost-contributor
  # p99 на нагрузке.
  log_requests: false


fs:
  enabled: true
  provider: "minio"
  bucket: "staging-bucket"
  endpoint: "https://minio-staging:9000"
  interface_endpoint: "https://minio-staging:9001"
  use_ssl: true
  verify: true
  ca_bundle: null


skb:
  prod_url: "https://api.skb-techno.ru/v2/Requests/"
  test_url: "https://test-api.skb-techno.ru/v2/Requests/"


dadata:
  base_url: "https://suggestions.dadata.ru/suggestions/api/4_1/rs/"


antivirus:
  base_url: "https://kkdrweb.bank.srv:443"

cert_store:
  backend: "vault"
  hot_cache_ttl: 300
  vault_path: "secret/certs"
  mongo_collection: "certs"
  expire_warn_days: 30
  fallback_enabled: true
  watch_enabled: true
  watch_path: "/etc/certs"


# ADR-0371 (cycle 172): durable WatermarkStore — как в prod. В base.yml стоял
# ``backend: "memory"`` (in-process, теряется при рестарте/в multi-pod).
watermark:
  backend: "postgres"
  persist_min_interval: 1.0


# ADR-0377: локальный PG→SQLite snapshot в staging ВЫКЛЮЧЕН (в base.yml
# осталось ``enabled: true``). Файл ``var/db/snapshot.sqlite`` — per-pod:
# в multi-replica окружении каждый под держит свою копию (shared state
# между подами), а ``resilience.fallbacks.db_main.chain`` с ``sqlite_ro``
# рассчитан на локальный файл. Как в prod.
snapshot:
  enabled: false
