    owner: gd_integration_tools/dsl
    review_date: "2027-03-24"
    added_at: "2026-09-24"

  - file: src/backend/dsl/workflow/compiler/step_compilers/flow.py
    line: 155
    reason: >
      Workflow step compilation — local ``outputs.get(sid)`` dict для
