# ──────────────────────────────────────────────────────────────────────
# staging.yml — overlay для предпродакшн-окружения.
#
# Все хосты/порты/секреты приходят извне (env / Vault) — здесь только
# staging-специфичные значения, которые отличаются от base.yml. Файл
# обязан быть самодостаточным после deep-merge с base.yml.
# ──────────────────────────────────────────────────────────────────────

app:
  environment: "staging"
  debug_mode: false
  host: "0.0.0.0"
  port: 8000
  use_ssl: true
  opentelemetry_endpoint: "http://otel-collector:4317"
  telemetry_enabled: true
  admin_enabled: true
  monitoring_enabled: true


security:
  admin_ips: []
  admin_routes:
    - "/admin"
    - "/admin/*"
    - "/metrics"
  allowed_hosts:
    - "*.staging.local"


# B-12 fix (cycle 37) + cycle 38 Task #1: pre-production enforcement policy
# engines (OPA + Casbin). engine_enabled=True обязывает composition root
# инстанцировать runtime policy-цепочку. На staging это позволяет заранее
# валидировать rego-пакеты и Casbin-модель до prod-релиза. dev/dev_light
# остаются выключенными (default OFF в base.yml). URLs — из env, чтобы
# тестовая конфигурация k8s-Namespace отличалась от prod.
policy:
  engine_enabled: true
  opa_url: "${OPA_URL:-http://opa-staging:8181}"
  opa_policy_name: "authz/default"
  casbin_model_path: "${CASBIN_MODEL_PATH:-/etc/casbin/model.conf}"
  casbin_policy_path: "${CASBIN_POLICY_PATH:-/etc/casbin/policies.csv}"


database:
  type: "postgresql"
  host: "postgres-staging"
  port: 5432
  name: "main_db"
  ssl_mode: "require"
  ca_bundle: null
  # Sprint 6 K2: staging pool tuning — половина prod-объёма.
  pool_size: 15
  max_overflow: 10
  pool_recycle: 1800
  pool_timeout: 15
  pool_pre_ping: true
  pool_use_lifo: true


external_databases:
  ssl_mode: "require"
  ca_bundle: null
  connections: []
  pool_size: 8
  max_overflow: 5
  pool_pre_ping: true


redis:
  enabled: true
  host: "redis-staging"
  port: 6379
  db_cache: 2
  db_queue: 3
  db_limits: 4
  db_tasks: 5
  use_ssl: true
  ca_bundle: null
  socket_keepalive: true
  main_stream: "events_stream"
  dlq_stream: "events_dlq"


mongo:
  enabled: true
  host: "mongo-staging"
  port: 27017
  name: "mongo"


queue:
  enabled: true
  type: "rabbitmq"
  host: "rabbitmq-staging"
  port: 5672
  ui_port: 15672
  use_ssl: true
  ca_bundle: null


mail:
  host: "smtp-staging"
  port: 587
  sender: "noreply@staging.local"
  use_tls: true
  validate_certs: true
  ca_bundle: null
  template_folder: null


log:
  host: "graylog-staging"
  port: 9000
  use_tls: true
  ca_bundle: null


fs:
  enabled: true
  provider: "minio"
  bucket: "staging-bucket"
  endpoint: "https://minio-staging:9000"
  interface_endpoint: "https://minio-staging:9001"
  use_ssl: true
  verify: true
  ca_bundle: null


skb:
  prod_url: "https://api.skb-techno.ru/v2/Requests/"
  test_url: "https://test-api.skb-techno.ru/v2/Requests/"


dadata:
  base_url: "https://suggestions.dadata.ru/suggestions/api/4_1/rs/"


antivirus:
  base_url: "https://kkdrweb.bank.srv:443"

cert_store:
  backend: "vault"
  hot_cache_ttl: 300
  vault_path: "secret/certs"
  mongo_collection: "certs"
  expire_warn_days: 30
  fallback_enabled: true
  watch_enabled: true
  watch_path: "/etc/certs"
