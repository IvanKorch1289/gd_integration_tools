apiVersion: v1
kind: Secret
metadata:
  name: gd-app-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: gd-integration-tools
    app.kubernetes.io/component: secrets
type: Opaque
# NOTE: In production, use ExternalSecrets + Vault operator.
# This placeholder Secret is for development/staging only.
#
# ADR-0444: плейсхолдеры в проде — риск « helm install прошёл, но креды
# неверные » (проверено: VAULT_TOKEN=CHANGEME попадал в кластер). Поэтому
# рендер **падает**, если значения остались плейсхолдерами. Отключается
# осознанно: `--set secrets.allowPlaceholders=true` (только dev/staging).
{{- if not .Values.secrets.allowPlaceholders }}
{{- if or (eq (default "" .Values.secrets.vaultToken) "CHANGEME") (eq (default "" .Values.secrets.vaultToken) "") }}
{{- fail "secrets.vaultToken is a placeholder (CHANGEME/empty) — set a real token or use --set secrets.allowPlaceholders=true (dev/staging only)" }}
{{- end }}
{{- end }}
stringData:
  GD_DATABASE_URL: {{ printf "postgresql://gd_user:***@%s/%s" .Values.app.env.DB_HOST .Values.app.env.DB_NAME }}
  GD_REDIS_URL: {{ printf "redis://%s:%s/0" .Values.app.env.REDIS_HOST .Values.app.env.REDIS_PORT }}
  GD_TEMPORAL_URL: {{ printf "%s:%s" .Values.app.env.TEMPORAL_HOST .Values.app.env.TEMPORAL_PORT }}
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | default "CHANGEME" }}
  # LLM API keys (optional, for cloud AI providers)
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" }}
