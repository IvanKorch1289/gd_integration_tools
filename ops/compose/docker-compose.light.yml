# docker-compose.light.yml (Sprint 54 W2)
#
# Лёгкий dev-стек: только app + workflow-worker.
# Без postgres/redis/clamav — работает с in-memory/SQLite backends (APP_PROFILE=dev_light).
#
# Запуск:
#   docker compose -f docker-compose.light.yml up -d
#   # или
#   make up-light
#
# Остановка:
#   make down-light
#
# Логи: docker compose -f docker-compose.light.yml logs -f
#
# Полная инфраструктура (postgres + redis + clamav): docker-compose.yml

services:
  app:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    image: gd-integration-tools:light
    container_name: gd-app-light
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: dev_light
      APP_SERVER: ${APP_SERVER:-granian}
      APP_WORKERS: ${APP_WORKERS:-2}
      # 2026-08-13: MCP HTTP transport НЕ включается в light-profile.
      # Причина: ``fastmcp>=3.2.4`` (ADR-0070 §3) входит в ``[mcp]`` extra,
      # но НЕ в ``[dev-light]`` extra (``pyproject.toml``). Монтирование
      # ``/mcp`` в ``light`` стеке даёт 404 ("fastmcp is not installed").
      # Для тестирования MCP нужен ``[dev]`` или ``[mcp]`` extra +
      # ``MCP_HTTP_ENABLED=true``. См. docs/audit/SYNTHESIS_2026-08-13.md §10.
    # D-A12-05 fix (cycle 23): mem_limit/cpus для light-профиля (dev_light).
    # Консервативные defaults (override через env): 1 GB / 0.5 CPU.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    cpus: ${APP_CPUS:-0.5}
    volumes:
      - ../../.run:/app/.run  # logs, sqlite, runtime state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  workflow-worker:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    image: gd-integration-tools:light
    container_name: gd-worker-light
    # Worker entry-point: src.backend.infrastructure.workflow.worker.main()
    # (см. K-OPS-4 fix в docker-compose.yml).
    # D-AUDIT-15901 fix (cycle 159): use entrypoint to override
    # Dockerfile ENTRYPOINT (tini + manage.py). 'command: [...]'
    # appended to entrypoint → 'python manage.py python -m ...' →
    # 'No such command python'. Light compose не имел entrypoint,
    # worker restart'ился бесконечно.
    entrypoint: ["python", "-m", "src.backend.infrastructure.workflow.worker"]
    command: ["run"]
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: dev_light
      WORKFLOW_WORKER_EXECUTOR: ${WORKFLOW_WORKER_EXECUTOR:-lite}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-10}
    volumes:
      - ../../.run:/app/.run
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_COUNT:-1}
    healthcheck:
      # 2026-08-14 fix (D-AUDIT-20701): заменён ps-grep (FAILED — `ps`
      # не в $PATH slim image). Worker слушает K8s probes на :9100
      # (WorkerProbesServer). TCP check на :9100 universal.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 9100), timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Нет postgres, redis, clamav, migration-runner — dev_light profile
  # использует SQLite/in-memory backends.

  # D-AUDIT-20801 (cycle 208): standalone gRPC-сервер для functional testing.
  # Поднимает OrderGRPCServicer/InvokerGRPCServicer/FileStreamGRPCServicer на
  # Unix socket ``/tmp/order_service.sock`` (default из base.yml). Lightweight:
  # ~512 MB mem, no replicas. Volume mount разделяет /tmp между app + grpc-server.
  # Используется manage.py ``grpc-serve`` command (cycle 208) вместо
  # ``python -m <module>`` потому что latter has cyclic-import warnings
  # из-за package __init__.py exports.
  grpc-server:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    image: gd-integration-tools:light
    container_name: gd-grpc-light
    # D-AUDIT-20801 fix (cycle 208): ``python -c`` с deferred import ВНУТРИ
    # main body (не на top-level) чтобы обойти cyclic-import warning из
    # __init__.py → from .server import serve. После import serve()
    # вызывается через asyncio.run.
    entrypoint: ["python", "-c"]
    # ruff: noqa: E501 (line length)
    command: ["import asyncio; from src.backend.entrypoints.grpc.grpc_server.server import serve; asyncio.run(serve())"]
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: dev_light
      GRPC_SOCKET_PATH: /tmp/order_service.sock
      GRPC_MAX_WORKERS: "10"
    volumes:
      - ../../.run:/app/.run
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/tmp/order_service.sock'); s.close()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

