# Workflow DSL: code_interpreter_loop
#
# ADR-0409 (волна 22): шаги приведены к реально существующим targets и
# к реальной семантике потока.
#
# Соответствие (порядок шагов и бизнес-логика потока не менялись):
#   receive_dataset        → skb:fetch_result        (получение данных)
#   llm_propose_code       → ai.chat                 (LLM-предложение кода)
#   execute_code_sandboxed → sandbox:execute_code    (исполнение в sandbox)
#   evaluate_results       → sandbox:evaluate_result (оценка результата)
#   format_final_report    → export.to_pdf           (формирование отчёта)
#
# ADR-0409: шаг исполнения кода больше НЕ подменяется LLM-вызовом
# ``ai.run_agent`` (тот ничего не исполнял). Исполнение — реальный
# изолированный sandbox ядра (``CodeSandbox``/E2B, ADR-0409 §Решение);
# при недоступном sandbox'е действие падает fail-closed, а не возвращает
# «пустой» результат.
#
# Ограничение (owner-задача, вне зоны кластера): подстановка
# ``${{ ... }}`` между шагами не реализована в workflow-компиляторе ядра
# (``src/backend/dsl/workflow/compiler/step_compilers/activity.py``) —
# до её реализации поток исполняется внешним оркестратором, который
# подставляет значения himself. Шаги и их targets при этом реальны.
name: code_interpreter_loop
version: "1.0"
description: |
  Data analysis loop: LLM предлагает Python-код → исполнение в
  изолированном sandbox'е → оценка результата → (сигнал continue_loop)
  → отчёт.

  Template tags: ai, code-execution, sandbox, loop.
default_timeout_s: 1800
default_retry_policy:
  initial_interval_s: 1.0
  backoff_coefficient: 2.0
  maximum_interval_s: 30.0
  max_attempts: 3
steps:
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      order_uuid: "${{ order_uuid }}"
      response_type_str: "JSON"
    timeout_s: 60
  - type: activity
    name: ai.chat
    args:
      messages:
        - role: "user"
          content: "${{ steps.0 }}"
      model: "claude-opus-4-7"
    timeout_s: 90
  - type: activity
    name: extensions.credit_pipeline.sandbox:execute_code
    args:
      code: "${{ steps.1.content }}"
      timeout_s: 60
    timeout_s: 120
  - type: activity
    name: extensions.credit_pipeline.sandbox:evaluate_result
    args:
      exit_code: "${{ steps.2.exit_code }}"
      stdout: "${{ steps.2.stdout }}"
      stderr: "${{ steps.2.stderr }}"
    timeout_s: 60
  - type: wait_signal
    signal_name: continue_loop
    timeout_s: 600
  - type: activity
    name: export.to_pdf
    args:
      rows: "${{ steps.3 }}"
      title: "Code interpreter report"
    timeout_s: 90
