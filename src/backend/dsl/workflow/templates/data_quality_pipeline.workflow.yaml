name: data_quality_pipeline
version: "1.0"
description: |
  Data Quality Pipeline — ingest → validate → enrich → publish (parallel branches).
  Template tags: data, ingest, etl, parallel.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: activity
    name: connector.import
    args:
      payload: {}
    timeout_s: 120
  - type: activity
    name: dq.schema_infer
    args:
      data: {}
      dataset: default
    timeout_s: 60
  - type: activity
    name: ai.parse_webpage
    args:
      url: https://example.com/lookup
    timeout_s: 90
  - type: activity
    name: analytics.insert_event
    args:
      table: data_quality_events
      event: {}
    timeout_s: 60
