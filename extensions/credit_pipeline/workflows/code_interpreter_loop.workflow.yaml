# Workflow DSL: code_interpreter_loop
#
# ADR-0403 (волна 21): activity-имена приведены к реально существующим
# targets. До фикса шаги ссылались на несуществующие activity
# (``receive_dataset``, ``llm_propose_code``, ``execute_code_sandboxed``,
# ``evaluate_results``, ``format_final_report``) — build-time резолв
# (ADR-0398, ``collect_activities(declarations, validate=True)``) ронял
# подъём Temporal-Worker'а со списком неизвестных имён.
#
# Соответствие (порядок шагов, wait_signal и бизнес-логика потока не
# менялись):
#   receive_dataset       → skb:fetch_result   (получение данных)
#   llm_propose_code      → ai.chat             (LLM-предложение)
#   execute_code_sandboxed→ ai.run_agent       (исполнение агентом)
#   evaluate_results      → normalize:apply_rules(оценка результата)
#   format_final_report   → export.to_pdf       (формирование отчёта)
#
# e2b-sandbox в расширении не реализован — исполнение делегировано
# реальному AI-агенту ядра. Owner-задача: sandbox-исполнитель
# (ADR-0403 §Открытое).
name: code_interpreter_loop
version: "1.0"
description: |
  Data analysis loop через e2b sandbox (Sprint 12 K4 W1).

  LLM предлагает Python код → e2b sandbox исполняет → eval → если
  not_done — цикл (через signal + activity).

  Template tags: ai, code-execution, sandbox, loop, e2b.
default_timeout_s: 1800
default_retry_policy:
  initial_interval_s: 1.0
  backoff_coefficient: 2.0
  maximum_interval_s: 30.0
  max_attempts: 3
steps:
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      body:
        order_uuid: "${{ order_uuid }}"
        response_type_str: "JSON"
    timeout_s: 60
  - type: activity
    name: ai.chat
    args:
      messages:
        - role: "user"
          content: "${{ steps.0 }}"
      model: "claude-opus-4-7"
    timeout_s: 90
  - type: activity
    name: ai.run_agent
    args:
      prompt: "${{ steps.1 }}"
      agent_id: "code_interpreter"
    timeout_s: 120
  - type: activity
    name: extensions.credit_pipeline.functions.normalize:apply_rules
    args:
      body:
        score: "${{ steps.2.credit_score }}"
        decision: "${{ steps.2.risk_class }}"
    timeout_s: 60
  - type: wait_signal
    signal_name: continue_loop
    timeout_s: 600
  - type: activity
    name: export.to_pdf
    args:
      rows: "${{ steps.3 }}"
      title: "Code interpreter report"
    timeout_s: 90
