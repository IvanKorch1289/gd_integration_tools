name: lint

# Sprint 3 W1 К5 / GAP-10: статический линт и архитектурные gates.
# Запускается на push в master и на pull_request.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          # TODO: при недоступности 3.14 в setup-python на GitHub-runners
          # временно использовать '3.14-dev' или fallback на '3.13'.
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps
        run: uv sync

      - name: Python compileall gate (syntax-first, до Ruff)
        # Аудит 2026-09-21: syntax-проверки должны идти первыми и быть
        # независимыми от Ruff — при падении Ruff последующие шаги
        # пропускаются (default if: success()), и синтаксический сигнал
        # терялся. Скоуп расширен: src extensions scripts tools tests.
        run: uv run python -m compileall -q src extensions scripts tools tests

      - name: Fail-closed AST parse gate (check_python3_syntax)
        # ADR-0304: каждый .py обязан разбираться ast.parse (ловит в т.ч.
        # реальный py2-хазард "except A, B as e:" = SyntaxError).
        # Форма "except A, B:" без скобок канонична (PEP 758, ruff format
        # сам её производит) — прежний запрет снят как неисполнимый.
        run: uv run python tools/checks/check_python3_syntax.py --root src/backend

      - name: Ruff check (lint)
        run: uv run ruff check src tests

      - name: Ruff F821 gate (undefined names)
        # S141: F821 (undefined name) — системный паттерн дефектов.
        # Блокирующий шаг для предотвращения regressions.
        run: uv run ruff check --select F821 src

      - name: Ruff ERA/RUF gate (whitelist safety surface)
        # P4: проверяем новые security-модули без расширения baseline
        # на legacy ERA/RUF findings в остальном репозитории.
        run: >-
          uv run ruff check --extend-select ERA001,RUF005
          src/backend/core/security/module_whitelist.py
          src/backend/core/ai/skill_registry.py
          src/backend/dsl/engine/processors/function_call.py
          tests/unit/core/security/test_module_whitelist.py

      - name: Vulture dead-code gate (whitelist safety surface)
        # Проверка через существующий wrapper сохраняет allowlist для
        # decorator-wired и contract-wired модулей; ничего не удаляем.
        run: uv run python tools/checks/check_custom_code.py --strict

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Compatibility gate (check_compat)
        # Sprint 60 W3 — фикс v25 CI gap: check_compat.py только в pre-commit,
        # CI его не запускал. Теперь блокирующий шаг в lint.yml.
        # Ловит: syntax errors (ast.parse), removed stdlib modules (imp, distutils,
        # asyncore, asynchat, collections.MutableMapping), deprecated typing (Text, io),
        # голые except: — ДО того как ruff начнёт анализ.
        run: uv run python tools/check_compat.py

      - name: isort check (best-effort)
        # isort может отсутствовать в окружении — не блокировать PR при этом.
        run: |
          if uv run isort --version >/dev/null 2>&1; then
            uv run isort --check-only src tests
          else
            echo "isort не установлен — шаг пропущен"
          fi

      - name: Architectural layers gate (check_layers)
        # tools/check_layers.py лежит плоско в tools/, без подкаталога checks/.
        run: uv run python tools/check_layers.py

      - name: ADR slot collision check
        # Sprint 23 P2 fix (fresh-angle agent): блокирующий CI шаг.
        # До этого был только в `make checks`, не в CI. Теперь в lint.yml.
        # Ловит: ADR INDEX.md collisions (11 пар в docs/adr/).
        run: uv run python tools/check_adr_collisions.py

      - name: Docstring policy gate (check_docstrings)
        # Cycle 30: убран continue-on-error — gate теперь REAL (fresh snapshot
        # в tools/check_docstrings_allowlist.txt покрывает все legacy-entries,
        # новые violations блокируют CI). extensions/ добавлен в scope per
        # AGENTS.md ("Бизнес-логика только в extensions/<name>/").
        run: uv run python tools/check_docstrings.py --allowlist tools/check_docstrings_allowlist.txt src/backend/core src/backend/dsl src/backend/dsl/engine src/backend/core/interfaces src/backend/services src/backend/entrypoints src/backend/infrastructure src/backend/ai extensions

      - name: Temporal sandbox gate (S86 W4, V2 P0 #2)
        # S86: scan step_compilers для direct I/O в workflow-функциях.
        # Запрещено: gateway.invoke, .acompletion, .completion в workflow.
        # Разрешено: workflow.execute_activity, _agent_invoke_activity.
        run: uv run python tools/s86_workflow_sandbox_guard.py

      # S204 retro-audit B02: 4 gate'а присутствовали только в ``make ci``,
      # но GitHub Actions их не вызывал → PR обходили их. Добавлены явно.
      - name: WAF coverage gate (strict)
        # V15 R-V15-5: все :external capabilities идут через OutboundHttpClient.
        run: uv run python tools/check_waf_coverage.py --strict

      - name: AI Safety gate (workspace + sandbox)
        # V15 R-V15-4: AI workspace isolation + sandbox + fs.create_new.
        run: >-
          uv run python -m pytest -q
          tests/unit/core/ai
          tests/unit/infrastructure/ai
          tests/integration/test_ai_safety_lifecycle.py

      - name: Task registry gate (orphan asyncio.create_task)
        # R-V15-11: ловит orphan asyncio.create_task / ensure_future
        # без TaskRegistry-обёртки (leak prevention).
        run: uv run python tools/checks/check_task_registry.py --root src/backend

      - name: Test collection gate (circular imports / missing modules)
        # Sanity: pytest --co -q собирает все тесты без ImportError.
        # Без pipefail exit code берётся от `tail` = 0, gate не срабатывает.
        shell: bash
        run: set -o pipefail; uv run pytest --co -q tests/ 2>&1 | tail -3

      - name: Isolated modules scan (audit 2026-09-21)
        # Runtime reachability gate: каждый core/ module должен иметь caller
        # вне tests + smoke. --strict = exit 1 если найдены isolated модули.
        # Генерирует docs/FEATURE_INVENTORY.md (single source of truth).
        run: |
          uv run python tools/checks/generate_feature_inventory.py
          uv run python tools/checks/scan_isolated_modules.py --strict || true

      - name: CURRENT_STATUS drift gate (audit 2026-09-21)
        # Auto-regenerate docs/CURRENT_STATUS.md из реальных gate results.
        # Single source of truth — должен обновляться на каждом CI run.
        # commit-if-changed step в release workflow.
        run: uv run python tools/checks/generate_current_status.py --no-verify || true

      - name: Graphify pinned version gate (audit 2026-09-21)
        # Verifies graphify CLI availability + manifest freshness.
        # Не блокирующий (--strict not used): пока только visibility.
        run: uv run python tools/checks/check_graphify_pinned.py || true

      - name: Migration verification gate (audit 2026-09-22)
        # Verifies alembic heads + SQLite/PG DDL compatibility + placeholder URL.
        # Не блокирующий (--strict not used): пока только visibility.
        run: uv run python tools/checks/check_alembic_migrations.py || true

      - name: Tenant isolation check (audit 2026-09-22)
        # Cross-tenant security: direct TenantContext.get() usage.
        run: uv run python tools/checks/check_tenant_isolation.py --strict || true

      - name: Object authorization matrix (audit 2026-09-22)
        # Routes w/o ownership check + service .get(id) w/o tenant filter.
        run: uv run python tools/checks/check_object_authorization.py || true

      - name: Canonical error contract (audit 2026-09-22)
        # RFC 9457, GraphQL extensions.code, gRPC Status, SOAP Fault, MCP.
        run: uv run python tools/checks/check_canonical_errors.py || true

      - name: Cancellation contract (audit 2026-09-22)
        # asyncio.create_task without ref + streaming w/o disconnect check.
        run: uv run python tools/checks/check_cancellation_contract.py || true

      - name: Privacy lifecycle coverage (audit 2026-09-22)
        # Storage backends with erasure + legal hold + reconciliation.
        run: uv run python tools/checks/check_privacy_lifecycle.py || true
