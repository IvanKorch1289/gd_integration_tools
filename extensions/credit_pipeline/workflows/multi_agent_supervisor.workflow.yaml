# Workflow DSL: multi_agent_supervisor
#
# ADR-0403 (волна 21): activity-имена приведены к реально существующим
# targets. До фикса шаги ссылались на несуществующие activity
# (``collect_loan_inputs``, ``supervisor_dispatch``, ``risk_agent``,
# ``compliance_agent``, ``scoring_agent``, ``consolidate_results``,
# ``final_decision``) — build-time резолв (ADR-0398,
# ``collect_activities(declarations, validate=True)``) ронял подъём
# Temporal-Worker'а со списком неизвестных имён.
#
# Соответствие (порядок шагов и бизнес-логика потока не менялись):
#   collect_loan_inputs → skb:fetch_result              (входные данные)
#   supervisor_dispatch → ai.run_agent                  (диспетчеризация)
#   risk_agent          → agents:scoring_agent          (risk-скоринг)
#   compliance_agent    → agents:document_parser_agent  (комплаенс-разбор)
#   scoring_agent       → agents:scoring_agent          (скоринг)
#   consolidate_results → normalize:apply_rules          (консолидация)
#   final_decision      → agents:decision_agent          (решение)
#
# Отдельных risk/compliance-агентов в расширении нет — использованы
# реальные агенты credit_pipeline (scoring / document_parser).
# Owner-задача: выделенные risk/compliance-агенты (ADR-0403 §Открытое).
name: multi_agent_supervisor
version: "1.0"
description: |
  Multi-agent supervisor для loan approval (Sprint 12 K4 W1).

  Supervisor LLM (Opus) распределяет работу между 3 specialist agents
  (risk / compliance / scoring) и консолидирует решение.

  Template tags: ai, multi-agent, supervisor, loan, parallel.
default_timeout_s: 600
steps:
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      body:
        order_uuid: "${{ order_uuid }}"
        response_type_str: "JSON"
    timeout_s: 60
  - type: activity
    name: ai.run_agent
    args:
      prompt: "${{ steps.0 }}"
      agent_id: "credit_supervisor"
    timeout_s: 30
  - type: activity
    name: extensions.credit_pipeline.agents:scoring_agent
    args:
      applicant_id: "${{ applicant_id }}"
      amount: "${{ loan_amount }}"
      duration_months: "${{ term_months }}"
      monthly_income: "${{ monthly_income }}"
    timeout_s: 60
  - type: activity
    name: extensions.credit_pipeline.agents:document_parser_agent
    args:
      applicant_id: "${{ applicant_id }}"
      amount: "${{ loan_amount }}"
      duration_months: "${{ term_months }}"
      purpose: "${{ purpose }}"
    timeout_s: 60
  - type: activity
    name: extensions.credit_pipeline.agents:scoring_agent
    args:
      applicant_id: "${{ applicant_id }}"
      amount: "${{ loan_amount }}"
      duration_months: "${{ term_months }}"
      monthly_income: "${{ monthly_income }}"
    timeout_s: 30
  - type: activity
    name: extensions.credit_pipeline.functions.normalize:apply_rules
    args:
      body:
        score: "${{ steps.4.credit_score }}"
        decision: "${{ steps.4.risk_class }}"
    timeout_s: 5
  - type: activity
    name: extensions.credit_pipeline.agents:decision_agent
    args:
      applicant_id: "${{ applicant_id }}"
      scoring_agent: "${{ steps.5 }}"
    timeout_s: 30
