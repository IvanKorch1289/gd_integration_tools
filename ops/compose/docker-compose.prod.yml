# Production deployment — full infrastructure stack.
#
# Назначение:
#     Поднимает полный стек: app + workflow-worker + Kafka + Minio +
#     Vault + OTEL Collector + Schema Registry + Debezium Connect +
#     OpenWebUI + JupyterHub + ClickHouse.
#
#     Celery worker/beat — только за `--profile celery` (см. комментарий
#     в блоке Celery: пакет celery и модуль src.backend.tasks.celery_app
#     в проекте отсутствуют, сервисы были в CrashLoopBackOff).
#
# Профиль: production (APP_PROFILE=prod для app и workflow-worker).
#
# Требования prod.yml:
#     - opentelemetry_endpoint: "http://otel-collector:4317"
#     - telemetry_enabled: true
#     - monitoring_enabled: true
#     - kafka.enabled: true
#     - vault.enabled: true
#
# Секреты сервисов (экспортировать в окружение или положить в
# ops/compose/.env — значения НЕ хранятся в этом файле):
#     - CLICKHOUSE_PASSWORD   — пользователь ClickHouse (app + сервис)
#     - OPEN_WEBUI_SECRET_KEY — секрет сервиса OpenWebUI (WEBUI_SECRET_KEY)
#     - JUPYTER_HUB_API_TOKEN — API-токен JupyterHub (app + регистрация
#       в хабе, см. ops/compose/jupyterhub/jupyterhub_config.py)
#
# Использование:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
#
# Связано:
#     - docs/ops/docker-compose-gap.md — gap analysis
#     - ADR-0092 — Vault zero-downtime rotation
#     - ADR-0096 — Correlation→OTel trace_id binding

services:
  # ─── Observability ───────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector:0.99.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
    networks:
      - default

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "true"
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - default

  # ─── Kafka ────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      # P0 (функциональный прогон compose, 2026-11-19): переменная была
      # отсутствовала → confluent-образ завершался с «KAFKA_ZOOKEEPER_CONNECT
      # is required» (код 1) → Kafka в проде не поднималась, а app/
      # workflow-worker оставались в статусе Created (depends_on не
      # выполнялся).
      KAFKA_ZOOKEEPER_CONNECT: kafka-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  kafka-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMAREGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMAREGISTRY_HOST_NAME: schema-registry
      SCHEMAREGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - default

  connect-distributed:
    image: debezium/connect:2.4
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: compose-connect-cluster
      CONFIG_STORAGE_TOPIC: compose-connect-configs
      OFFSET_STORAGE_TOPIC: compose-connect-offsets
      STATUS_STORAGE_TOPIC: compose-connect-statuses
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OFFSET_FLUSH_INTERVAL_MS: 10000
      OFFSET_FLUSH_TIMEOUT_MS: 5000
    ports:
      - "8083:8083"
    networks:
      - default

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8090:8080"
    networks:
      - default

  # ─── Object Storage ────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T17-07-06Z
    command: server /data --console-address ":9001"
    environment:
      # Fail-closed: дефолтный пароль «minioadmin» — публично известный
      # (MinIO docs), в prod-стеке он означал бы открытый S3.
      # Как у clickhouse/open-webui — значение обязано прийти из env.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for prod}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ─── Secrets ──────────────────────────────────────────────────────────
  # ВНИМАНИЕ (P1, аудит 2026-11-18): dev-режим Vault (`server -dev`) —
  # in-memory storage, без TLS и без HA. Он остаётся в стеке как заглушка,
  # но root-токен больше НЕ зашит в репозиторий: значение обязано прийти
  # из env (fail-closed, как CLICKHOUSE_PASSWORD / WEBUI_SECRET_KEY).
  # Полноценный prod-Vault (TLS + seal/unseal + storage backend) —
  # отдельная задача инфраструктуры, см. docs/roadmap/PROD_READINESS_GAPS.md.
  vault:
    image: hashicorp/vault:1.15
    command: server -dev -dev-root-token-id=${VAULT_ROOT_TOKEN:?VAULT_ROOT_TOKEN must be set for prod}
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?VAULT_ROOT_TOKEN must be set for prod}
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - default

  # ─── Analytics ───────────────────────────────────────────────────────
  # ClickHouse — хранилище audit-трейла (features.audit_clickhouse_enabled
  # в prod-профиле, ADR-0441). DDL накатывается из
  # src/backend/services/audit/migrations (docker-entrypoint-initdb.d).
  # Пароль — только из env (CLICKHOUSE_PASSWORD); в compose не хардкодится.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.65
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set for prod}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../src/backend/services/audit/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"   # HTTP (его использует клиент приложения)
      # native: host-порт 9000 уже занят MinIO (API) → конфликт биндинга,
      # из-за которого стек не поднимался целиком. Host-порт — только для
      # внешних утилит; приложение ходит по service-DNS «clickhouse:9000»
      # (config_profiles/prod.yml → clickhouse.port), поэтому его не трогаем.
      - "9004:9000"   # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    networks:
      - default

  # ─── AI ──────────────────────────────────────────────────────────────
  # OpenWebUI — внутренний LLM-сервер (ADR-0412). Endpoint приложения:
  # open_webui.base_url = http://open-webui:3000 (prod-профиль).
  # PORT=3000 задан явно: в текущих образах OpenWebUI дефолт — 8080,
  # а контракт ADR-0412 (и k8s-Service open-webui) — порт 3000.
  # ─── RabbitMQ ────────────────────────────────────────────────────────
  # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
  # очередь (``queue.enabled: true``, ``type: rabbitmq``, host
  # ``rabbitmq-prod``), а сервиса в стеке не было → AMQPConnectionError
  # ([Errno 111] Connection refused) → приложение падало на старте.
  # Имя сервиса совпадает с host'ом из prod-профиля.
  rabbitmq-prod:
    image: rabbitmq:3.13-management-alpine
    environment:
      # P0 (функциональный прогон compose, 2026-11-19): пользователь
      # «guest» в RabbitMQ подключается ТОЛЬКО с localhost → из контейнера
      # приложения вход отклонялся (ACCESS_REFUSED). Нужен отдельный
      # пользователь, те же учётные данные передаются приложению.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gd}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        aliases:
          - rabbitmq-prod

  # ─── Redis ────────────────────────────────────────────────────────────
  # P0 (функциональный прогон compose, 2026-11-19): dev-сервис Redis поднимался
  # БЕЗ пароля, а приложение приходит с REDIS_PASSWORD (из env_file) → URL
  # вида redis://:admin@redis:6379 → «ERR Client sent AUTH, but no password is
  # set» → faststream-брокер не поднимался (таймаут 3 с) → приложение падало
  # на старте. В prod пароль обязателен и задаётся оператором.
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for prod}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for prod}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        # prod-профиль обращается к хосту «redis-prod» — алиас делает имя
        # разрешимым внутри docker-сети (P0, волна 36).
        aliases:
          - redis-prod

  # ─── MongoDB ──────────────────────────────────────────────────────────
  # P0 (функциональный прогон compose, 2026-11-19): config_profiles/prod.yml
  # включает ``mongo.enabled: true`` с host'ом ``mongo-prod``, но сервиса
  # MongoDB в стеке не было → lifecycle-операция ``start_mongo_client``
  # (required) упиралась в таймаут 30 с → lifespan падал с
  # «Остановка приложения из-за ошибки инициализации» — приложение в проде
  # не стартовало вовсе.
  #
  # Имя сервиса совпадает с host'ом из prod-профиля (``mongo-prod``), чтобы
  # приложение подключалось без env-переопределений.
  mongo-prod:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mongo}
      # P0 (функциональный прогон compose, 2026-11-19): сервис поднимался без
      # аутентификации, а приложение подключается с MONGO_USERNAME/
      # MONGO_PASSWORD (приходят из env_file) → «Authentication failed» →
      # таймаут 30 с в start_mongo_client → lifespan падал. Учётные данные
      # сервера должны совпадать с учётными данными приложения.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME must be set for prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set for prod}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    environment:
      PORT: "3000"
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?OPEN_WEBUI_SECRET_KEY must be set for prod}
      # Внутренний контур: самостоятельная регистрация пользователей не нужна.
      ENABLE_SIGNUP: "false"
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - default

  # ─── Notebooks ───────────────────────────────────────────────────────
  # JupyterHub — REST API для запуска ноутбуков (routes/jupyter_hub_run).
  # Токен приложения (JUPYTER_HUB_API_TOKEN) регистрируется в хабе как
  # API-токен пользователя-администратора — см.
  # ops/compose/jupyterhub/jupyterhub_config.py.
  jupyterhub:
    image: jupyterhub/jupyterhub:4.1.6
    environment:
      JUPYTER_HUB_API_TOKEN: ${JUPYTER_HUB_API_TOKEN:-}
      JUPYTER_HUB_API_USER: ${JUPYTER_HUB_API_USER:-admin}
      # Пусто → хаб генерирует свой crypt-key и сохраняет его в sqlite.
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:-}
    volumes:
      - jupyterhub_data:/srv/jupyterhub
      - ./jupyterhub/jupyterhub_config.py:/usr/local/etc/jupyterhub/jupyterhub_config.py:ro
    ports:
      # host-порт 8000 уже занят приложением (app: "8000:8000" из
      # docker-compose.yml) → конфликт биндинга. Внутри compose хаб
      # остаётся на 8000 (config_profiles/prod.yml → jupyter_hub.base_url
      # = http://jupyterhub:8000), меняется только host-порт.
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/hub/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - default

  # ─── Celery ───────────────────────────────────────────────────────────
  # P1 (аудит 2026-11-18): сервисы переведены за opt-in `profiles: [celery]`.
  # Причина: ни `celery`, ни `src.backend.tasks.celery_app` в проекте НЕТ
  # (celery не объявлен ни в pyproject, ни в uv.lock; модуль src/backend/tasks/
  # не существует) → контейнеры гарантированно падали в CrashLoopBackOff и
  # `docker compose up` завершался с ошибкой. Чтобы включить их, нужно:
  #   1) объявить `celery` в [project.optional-dependencies] и пересобрать lock;
  #   2) создать src/backend/tasks/celery_app.py;
  #   3) запускать стек с `--profile celery`.
  # До этого — только заглушки, чтобы стек поднимался.
  celery-worker:
    profiles: ["celery"]
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    entrypoint: ["python", "-m", "celery", "-A", "src.backend.tasks.celery_app", "worker"]
    command: ["--loglevel=INFO", "--concurrency=4"]
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: prod
      # ADR-0446: явный путь к расширениям (иначе 0 workflow-деклараций).
      EXTENSIONS_DIR: /app/extensions
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль
      # рассчитан на внешние сервисы K8s (redis-prod, postgres-prod), а
      # compose поднимает свои (redis, postgres). Без явного переопределения
      # приложение шло на «redis-prod» → «Error 111 connecting to
      # redis-prod:6379» → старт падал на scheduler-leader-election.
      DB_HOST: postgres
      REDIS_HOST: redis
      # Режим TLS для БД. По умолчанию — как в prod-профиле (require).
      # Для стенда без TLS (compose-postgres) оператор задаёт
      # DB_SSL_MODE=disable — иначе приложение не подключится
      # («server does not support SSL, but SSL was required»).
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
      # redis.use_ssl=true (схема rediss://), а compose-сервис Redis работает
      # без TLS → клиент зависал на TLS-handshake → faststream-брокер не
      # поднимался (таймаут 3 с) → granian-воркер падал и приложение
      # уходило в рестарт-цикл. Для стенда: REDIS_USE_SSL=false; для
      # прод-окружения с TLS-terminated Redis — true (значение по умолчанию).
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Аналогично для очереди: prod-профиль включает queue.use_ssl, а
      # compose-RabbitMQ работает без TLS (P0, волна 36).
      QUEUE_USE_SSL: ${QUEUE_USE_SSL:-false}
      QUEUE_USERNAME: ${RABBITMQ_USER:-gd}
      QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default

  celery-beat:
    profiles: ["celery"]
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    entrypoint: ["python", "-m", "celery", "-A", "src.backend.tasks.celery_app", "beat"]
    command: ["--loglevel=INFO", "--scheduler=celery.beat:PersistentScheduler"]
    env_file:
      - ../../.env
    environment:
      APP_PROFILE: prod
      # ADR-0446: явный путь к расширениям (иначе 0 workflow-деклараций).
      EXTENSIONS_DIR: /app/extensions
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль
      # рассчитан на внешние сервисы K8s (redis-prod, postgres-prod), а
      # compose поднимает свои (redis, postgres). Без явного переопределения
      # приложение шло на «redis-prod» → «Error 111 connecting to
      # redis-prod:6379» → старт падал на scheduler-leader-election.
      DB_HOST: postgres
      REDIS_HOST: redis
      # Режим TLS для БД. По умолчанию — как в prod-профиле (require).
      # Для стенда без TLS (compose-postgres) оператор задаёт
      # DB_SSL_MODE=disable — иначе приложение не подключится
      # («server does not support SSL, but SSL was required»).
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
      # redis.use_ssl=true (схема rediss://), а compose-сервис Redis работает
      # без TLS → клиент зависал на TLS-handshake → faststream-брокер не
      # поднимался (таймаут 3 с) → granian-воркер падал и приложение
      # уходило в рестарт-цикл. Для стенда: REDIS_USE_SSL=false; для
      # прод-окружения с TLS-terminated Redis — true (значение по умолчанию).
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Аналогично для очереди: prod-профиль включает queue.use_ssl, а
      # compose-RabbitMQ работает без TLS (P0, волна 36).
      QUEUE_USE_SSL: ${QUEUE_USE_SSL:-false}
      QUEUE_USERNAME: ${RABBITMQ_USER:-gd}
      QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  # ─── Switch app + workers to prod profile ─────────────────────────────
  app:
    environment:
      APP_PROFILE: prod
      # ADR-0446: явный путь к расширениям (иначе 0 workflow-деклараций).
      EXTENSIONS_DIR: /app/extensions
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль
      # рассчитан на внешние сервисы K8s (redis-prod, postgres-prod), а
      # compose поднимает свои (redis, postgres). Без явного переопределения
      # приложение шло на «redis-prod» → «Error 111 connecting to
      # redis-prod:6379» → старт падал на scheduler-leader-election.
      DB_HOST: postgres
      REDIS_HOST: redis
      # Режим TLS для БД. По умолчанию — как в prod-профиле (require).
      # Для стенда без TLS (compose-postgres) оператор задаёт
      # DB_SSL_MODE=disable — иначе приложение не подключится
      # («server does not support SSL, but SSL was required»).
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
      # redis.use_ssl=true (схема rediss://), а compose-сервис Redis работает
      # без TLS → клиент зависал на TLS-handshake → faststream-брокер не
      # поднимался (таймаут 3 с) → granian-воркер падал и приложение
      # уходило в рестарт-цикл. Для стенда: REDIS_USE_SSL=false; для
      # прод-окружения с TLS-terminated Redis — true (значение по умолчанию).
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Аналогично для очереди: prod-профиль включает queue.use_ssl, а
      # compose-RabbitMQ работает без TLS (P0, волна 36).
      QUEUE_USE_SSL: ${QUEUE_USE_SSL:-false}
      QUEUE_USERNAME: ${RABBITMQ_USER:-gd}
      QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
      APP_SERVER: ${APP_SERVER:-granian}
      APP_WORKERS: ${APP_WORKERS:-4}
      # P0 (функциональный прогон compose, 2026-11-19): токен не
      # пробрасывался в контейнер, а config_profiles/prod.yml включает
      # jupyter_hub.enabled=true → JupyterHubSettings (fail-closed) падал при
      # импорте настроек: «api_token обязателен при enabled=true» → app не
      # стартовал вообще. Fail-closed на уровне compose: стек не поднимается
      # без токена.
      JUPYTER_HUB_API_TOKEN: ${JUPYTER_HUB_API_TOKEN:?JUPYTER_HUB_API_TOKEN must be set for prod}
    # D-A12-05 fix (cycle 22): mem_limit/cpus для production app
    # (консервативные defaults, override через APP_MEM_LIMIT/APP_CPUS env).
    # Cycle 1 audit (hypothesis #1) confirmed: ни в одном compose-файле не было
    # resource limits — risk OOM kill всего compose-stack'а при runaway workload.
    mem_limit: ${APP_MEM_LIMIT:-4g}
    cpus: ${APP_CPUS:-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      migration-runner:
        condition: service_completed_successfully
      mongo-prod:
        condition: service_healthy
    healthcheck:
      # P1 (аудит 2026-11-18): было `curl -sf http://localhost:8000/docs`.
      # Две поломки: (1) `curl` НЕ установлен в runtime-слой образа
      # (ops/compose/Dockerfile) — curl есть только в builder-слое;
      # (2) в prod-профиле `app.enable_swagger=false` (config_profiles/prod.yml),
      # поэтому FastAPI монтирует без `docs_url` → /docs отдаёт 404.
      # Итог: app навсегда unhealthy → `depends_on: service_healthy`
      # не выполняется, стек не поднимается.
      # Канонический liveness-маршрут приложения — GET /health
      # (src/backend/plugins/composition/app_factory.py), он не требует
      # авторизации и не зависит от профиля.
      # P0 (функциональный прогон compose, 2026-11-19): без Host-заголовка
      # trusted-host middleware отвечал 400 («Invalid host header») →
      # контейнер вечно unhealthy → depends_on: service_healthy не
      # выполнялся. Liveness-маршрут /health опрашиваем с разрешённым
      # доменом из prod-профиля (*.prod.local).
      test: ["CMD", "curl", "-sf", "-H", "Host: api.prod.local", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  workflow-worker:
    environment:
      APP_PROFILE: prod
      # ADR-0446: явный путь к расширениям (иначе 0 workflow-деклараций).
      EXTENSIONS_DIR: /app/extensions
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль
      # рассчитан на внешние сервисы K8s (redis-prod, postgres-prod), а
      # compose поднимает свои (redis, postgres). Без явного переопределения
      # приложение шло на «redis-prod» → «Error 111 connecting to
      # redis-prod:6379» → старт падал на scheduler-leader-election.
      DB_HOST: postgres
      REDIS_HOST: redis
      # Режим TLS для БД. По умолчанию — как в prod-профиле (require).
      # Для стенда без TLS (compose-postgres) оператор задаёт
      # DB_SSL_MODE=disable — иначе приложение не подключится
      # («server does not support SSL, but SSL was required»).
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
      # redis.use_ssl=true (схема rediss://), а compose-сервис Redis работает
      # без TLS → клиент зависал на TLS-handshake → faststream-брокер не
      # поднимался (таймаут 3 с) → granian-воркер падал и приложение
      # уходило в рестарт-цикл. Для стенда: REDIS_USE_SSL=false; для
      # прод-окружения с TLS-terminated Redis — true (значение по умолчанию).
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Аналогично для очереди: prod-профиль включает queue.use_ssl, а
      # compose-RabbitMQ работает без TLS (P0, волна 36).
      QUEUE_USE_SSL: ${QUEUE_USE_SSL:-false}
      QUEUE_USERNAME: ${RABBITMQ_USER:-gd}
      QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
      WORKFLOW_WORKER_EXECUTOR: ${WORKFLOW_WORKER_EXECUTOR:-dsl}
      # P0 (функциональный прогон compose, 2026-11-19) — см. комментарий в
      # сервисе app: без токена настройки не поднимаются (fail-closed).
      JUPYTER_HUB_API_TOKEN: ${JUPYTER_HUB_API_TOKEN:?JUPYTER_HUB_API_TOKEN must be set for prod}
    # D-A12-05 fix (cycle 22): mem_limit/cpus для workflow-worker.
    mem_limit: ${WORKFLOW_WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKFLOW_WORKER_CPUS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
      mongo-prod:
        condition: service_healthy

  migration-runner:
    environment:
      APP_PROFILE: prod
      # ADR-0446: явный путь к расширениям (иначе 0 workflow-деклараций).
      EXTENSIONS_DIR: /app/extensions
      # P0 (функциональный прогон compose, 2026-11-19): dev-compose задаёт
      # ``REDIS_PASSWORD: ""`` (пароля у dev-Redis нет), а prod-Redis работает
      # с паролем → миграции подключались без учётных данных → NOAUTH →
      # клиент уходил в ретраи и падал с RecursionError. Учётные данные
      # обязаны совпадать с сервисом Redis.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for prod}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль
      # рассчитан на внешние сервисы K8s (redis-prod, postgres-prod), а
      # compose поднимает свои (redis, postgres). Без явного переопределения
      # приложение шло на «redis-prod» → «Error 111 connecting to
      # redis-prod:6379» → старт падал на scheduler-leader-election.
      DB_HOST: postgres
      REDIS_HOST: redis
      # Режим TLS для БД. По умолчанию — как в prod-профиле (require).
      # Для стенда без TLS (compose-postgres) оператор задаёт
      # DB_SSL_MODE=disable — иначе приложение не подключится
      # («server does not support SSL, but SSL was required»).
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # P0 (функциональный прогон compose, 2026-11-19): prod-профиль включает
      # redis.use_ssl=true (схема rediss://), а compose-сервис Redis работает
      # без TLS → клиент зависал на TLS-handshake → faststream-брокер не
      # поднимался (таймаут 3 с) → granian-воркер падал и приложение
      # уходило в рестарт-цикл. Для стенда: REDIS_USE_SSL=false; для
      # прод-окружения с TLS-terminated Redis — true (значение по умолчанию).
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Аналогично для очереди: prod-профиль включает queue.use_ssl, а
      # compose-RabbitMQ работает без TLS (P0, волна 36).
      QUEUE_USE_SSL: ${QUEUE_USE_SSL:-false}
      QUEUE_USERNAME: ${RABBITMQ_USER:-gd}
      QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for prod}
      # P0 (функциональный прогон compose, 2026-11-19) — см. комментарий в
      # сервисе app: без токена настройки не поднимаются (fail-closed).
      JUPYTER_HUB_API_TOKEN: ${JUPYTER_HUB_API_TOKEN:?JUPYTER_HUB_API_TOKEN must be set for prod}

  # ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  rabbitmq_data:
  mongo_data:
  minio_data:
  clickhouse_data:
  open_webui_data:
  jupyterhub_data:

networks:
  # P0 (функциональный прогон compose, 2026-11-19): ключ сети должен
  # совпадать с НЕЯВНОЙ сетью base-файла (``default``). При ключе
  # ``compose_default`` merge давал ДВЕ сети: сервисы prod-файла —
  # на ``compose_prod_network``, сервисы base-файла (app, workflow-worker,
  # migration-runner, postgres, redis) — на ``compose_default`` → app не
  # видел kafka/mongo/minio/vault (DNS резолвился, соединение отклонялось) →
  # старт падал на ``start_mongo_client`` с таймаутом 30 с.
  default:
    name: compose_prod_network
    driver: bridge
