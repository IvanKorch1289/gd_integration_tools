# ──────────────────────────────────────────────────────────────────────
# base.yml — общая нечувствительная конфигурация всех профилей
#
# Файл является единственным источником значений по умолчанию для
# параметров, не зависящих от окружения: timeouts, retries, pool_size,
# circuit_breaker_*, encoding, статические списки конечных точек, и т.п.
#
# Профильные файлы (config_profiles/{dev,dev_light,staging,prod}.yml)
# накладываются поверх base.yml через ``_deep_merge`` в
# ``src.core.config.config_loader.YamlConfigSettingsLoader``.
#
# Все секреты (api_key, password, *_secret, token, и т.п.) хранятся вне
# YAML — в env / Vault — и перечислены в .env.example.
#
# Двусторонний аудит:  ``python tools/config_audit.py``  (см. Makefile).
# ──────────────────────────────────────────────────────────────────────


vault:
  # Основной переключатель источника секретов. Override через env
  # VAULT_ENABLED (true/false). См. _is_vault_enabled в config_loader.
  enabled: true
  addr: "http://127.0.0.1:8200"
  secret_path: "secret/data/gd_integration_tools"


app:
  version: "0.1.0"
  title: "GD ADVANCED TOOLS"
  socket_ping_timeout: 10
  socket_close_timeout: 10
  gzip_minimum_size: 300
  gzip_compresslevel: 9
  enable_swagger: true
  enable_redoc: true
  # Sprint 8: HTTP/3 + WebTransport opt-in (aioquic). Сервер запускается
  # отдельно от granian: `python manage.py http3-serve`; требует extra
  # `http3` и валидные TLS-сертификаты (ALPN h3).
  # Раньше эти настройки жили в отдельной секции `http3:` — она была
  # «призраком»: модели с yaml_group="http3" в проекте нет, поэтому ключи
  # молча отбрасывались загрузчиком (Wave 13 Q17).
  http3_enabled: false
  http3_port: 8443


security:
  token_lifetime: 120
  refresh_token_lifetime: 4800
  algorithm: "HS256"
  request_timeout: 20.0
  rate_limit: 1000
  rate_time_measure_seconds: 60
  routes_without_api_key:
    - "/"
    - "/admin"
    - "/admin/*"
    - "/docs"
    - "/documents"
    - "/docs/"
    - "/docs/*"
    - "/redoc"
    - "/redoc/*"
    - "/openapi*"
    - "/asyncapi*"
    - "/documents/"
    - "/health"
    - "/health/live"
    - "/health/ready"
    - "/ready"
    - "/readyz"
    - "/livez"
    - "/metrics"
    - "/openapi.json"
    - "/tech/healthcheck-*"
    - "/tech/redirect-*"
    - "/tech/version"
    - "/tech/log-storage"
    - "/tech/file-storage"
    - "/tech/task-monitor"
    - "/tech/queue-monitor"
    # S171: auth endpoints must be public for Login page to fetch methods list
    # before user is authenticated. Without these, /Login crashes with
    # PermissionError (auth/methods) → traceback visible to user.
    - "/api/v1/auth/methods"
    - "/api/v1/auth/login"
    # M6-#3 (2026-09-09): pre-auth выпуск X-Step-Up-Token (до логина).
    - "/api/v1/auth/step-up-request"


tasks:
  task_max_attempts: 5
  task_seconds_delay: 30
  task_retry_jitter_factor: 0.5
  task_timeout_seconds: 300
  flow_max_attempts: 5
  flow_seconds_delay: 900
  flow_retry_jitter_factor: 0.5
  flow_timeout_seconds: 90000


# W22 F.2 C1 — главный Invoker Gateway (см. ADR-038).
invoker:
  default_mode: "sync"
  default_timeout_seconds: null
  allowed_modes:
    - "sync"
    - "async-api"
    - "async-queue"
    - "deferred"
    - "background"
    - "streaming"
  streaming_chunk_buffer_size: 64


grpc:
  socket_path: "/tmp/order_service.sock"
  max_workers: 20


# ADR-0371 (cycle 172): GraphQL-интроспекция.
#
# До cycle 172 секции ``graphql:`` не было ни в одном профиле, а дефолт
# модели (``GraphQLSettings.enable_introspection``) равен ``True`` — при
# этом docstring модели прямо обещал «отключить в prod». Runtime-запрет
# интроспекции вне development обеспечивает
# ``entrypoints/graphql/graphql_guards.py`` (``NoIntrospectionRule``);
# здесь фиксируется декларативное намерение профиля.
graphql:
  enable_introspection: false


scheduler:
  default_jobstore_name: "default"
  backup_jobstore_name: "backup"
  executors:
    default:
      type: "threadpool"
      max_workers: 20
    async:
      type: "asyncio"
  misfire_grace_time: 60
  max_instances: 1
  timezone: "Europe/Moscow"
  coalesce: true


http:
  max_retries: 3
  retry_backoff_factor: 0.5
  retry_status_codes:
    - 408
    - 429
    - 500
    - 502
    - 503
    - 504
  total_timeout: 30
  connect_timeout: 10
  sock_read_timeout: 15
  keepalive_timeout: 300
  limit: 100
  limit_per_host: 20
  ttl_dns_cache: 300
  force_close: false
  # ADR-0371 (cycle 172): проверка TLS-сертификатов ВКЛЮЧЕНА по умолчанию.
  # До cycle 172 здесь стояло ``false``, и ни prod, ни staging его не
  # переопределяли → в проде исходящие HTTPS-запросы принимали любой
  # сертификат (риск MITM). Потребители значения:
  #   infrastructure/clients/transport/http_httpx.py  → httpx verify=
  #   infrastructure/clients/transport/http/session_mixin.py → httpx verify=
  # Профили, которым нужен self-signed TLS (dev/dev_light), переопределяют
  # значение в своих overlay-файлах.
  ssl_verify: true
  waf_url: "esbgreendata"
  waf_route_header:
    x-api-key: "esbgreendata"
  circuit_breaker_max_failures: 5
  circuit_breaker_reset_timeout: 30
  enable_connection_purging: true
  purging_interval: 300


database:
  # Drivers — PostgreSQL defaults. Для Oracle переопределить в overlay
  # профиля: async_driver=oracledb, sync_driver=oracledb (валидируется
  # в DatabaseConnectionSettings.validate_oracle_drivers).
  # SQLite-драйверы выбираются принудительно в _build_dsn (aiosqlite/pysqlite).
  # sync_driver=psycopg (psycopg3): умеет и sync, и async; psycopg2 в проекте
  # отсутствует — нет ни в одном extra, ни в lock-файле.
  async_driver: "asyncpg"
  sync_driver: "psycopg"
  echo: false
  # Sprint 6 K2 (V15 R-V15-14): per-environment pool tuning матрица.
  # Базовые defaults подходят для staging; dev_light/dev/prod переопределяют
  # в своих overlay-файлах. pool_pre_ping=true обязателен под нагрузкой.
  pool_size: 10
  max_overflow: 10
  pool_recycle: 1800
  pool_timeout: 30
  pool_pre_ping: true
  pool_use_lifo: true
  connect_timeout: 10
  command_timeout: 30
  max_retries: 0
  circuit_breaker_max_failures: 10
  circuit_breaker_reset_timeout: 30
  slow_query_threshold: 1.0


external_databases:
  echo: false
  pool_size: 5
  max_overflow: 5
  pool_recycle: 1800
  pool_timeout: 30
  connect_timeout: 10
  command_timeout: 30
  max_retries: 0
  circuit_breaker_max_failures: 5
  circuit_breaker_reset_timeout: 30
  slow_query_threshold: 1.0
  connections: []


redis:
  encoding: "utf-8"
  # NOTE (cycle 164, ADR-0352): cache_expire_seconds мигрировал в cache: section.
  # Чтение через settings.redis.cache_expire_seconds сохранено как deprecated
  # property — backwards-compat. Удалить эту строку можно после cycle 166.
  max_connections: 20
  socket_timeout: 600
  socket_connect_timeout: 60
  retry_on_timeout: true
  max_stream_len: 1000
  approximate_trimming_stream: true
  retention_hours_stream: 8
  max_retries: 3
  ttl_hours: 1
  health_check_interval: 300
  streams:
    - name: "email"
      value: "email-notification-stream"
    - name: "order-send"
      value: "order-send-to-skb-stream"
    - name: "order-get-result"
      value: "order-get-result-from-skb-stream"
    - name: "order-pipeline"
      value: "order-start-pipeline_stream"
    - name: "actions"
      value: "actions-stream"


cache:
  backend: "redis"
  l1_enabled: true
  l1_maxsize: 1000
  keydb_active_replica: false
  # Cycle 164 (ADR-0352): cache_expire_seconds мигрировал из redis: сюда —
  # это CACHE concern, не redis-специфичный.
  cache_expire_seconds: 300
  # Cycle 168 (PROD_READINESS_LOGGING_CACHE_2026-10-20 §2.1): L3 disk
  # fallback управляется через YAML. ``disk_fallback_enabled=false`` для
  # in-cluster production (диск — anti-pattern, shared state между
  # подами). ``disk_fallback_path`` — относительно CWD; абсолютный путь
  # для выделенного storage volume (например, EmptyDir на k8s).
  disk_fallback_enabled: false
  disk_fallback_path: "var/cache/disk_fallback"


watermark:
  backend: "memory"
  persist_min_interval: 1.0


mongo:
  timeout: 5000
  max_pool_size: 10
  min_pool_size: 5


mail:
  connection_pool_size: 10
  command_timeout: 30
  connect_timeout: 10
  use_tls: false
  validate_certs: false
  circuit_breaker_max_failures: 15
  circuit_breaker_reset_timeout: 60


queue:
  timeout: 60
  reconnect_interval: 30
  max_consumers: 20
  # S90 M5-#5: backpressure на MQ (RabbitMQ prefetch_count / Kafka
  # max_poll_records). Раньше ключ висел на верхнем уровне файла
  # (`queue_consumer_max_prefetch`) и не читался ни одной моделью —
  # перенесён в секцию queue (Wave 13 Q17).
  consumer_max_prefetch: 10
  graceful_timeout: 30
  use_ssl: false
  queues:
    - name: "order-create"
      value: "order-init-create-queue"
    - name: "order-send"
      value: "order-send-queue"


fs:
  timeout: 30
  retries: 5
  key_prefix: "uploads"
  max_pool_connections: 20
  read_timeout: 30


log:
  udp_port: 12201
  use_tls: false
  level: "DEBUG"
  name_log_file: "app.log"
  dir_log_name: "logs"
  log_requests: true
  max_body_log_size: 4096
  required_fields:
    - "environment"
    - "hostname"
    - "user_id"
    - "action"
  conf_loggers:
    - name: "application"
      facility: "application"
    - name: "database"
      facility: "database"
    - name: "storage"
      facility: "storage"
    - name: "smtp"
      facility: "smtp"
    - name: "scheduler"
      facility: "scheduler"
    - name: "request"
      facility: "request"
    - name: "tasks"
      facility: "tasks"
    - name: "redis"
      facility: "redis"
    - name: "stream"
      facility: "stream"
    - name: "grpc"
      facility: "grpc"


