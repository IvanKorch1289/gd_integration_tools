# ──────────────────────────────────────────────────────────────────────
# prod.yml — overlay для production-окружения.
#
# Хосты/порты — placeholder'ы. Все секреты приходят из env / Vault.
# Файл накладывается поверх base.yml через _deep_merge.
# ──────────────────────────────────────────────────────────────────────

app:
  environment: "production"
  debug_mode: false
  server: "granian"
  host: "0.0.0.0"
  port: 8000
  use_ssl: true
  # ADR-0371 (cycle 172): prod не должен оставаться однопроцессным
  # dev-режимом (дефолт модели ``AppBaseSettings.workers=1`` и
  # ``granian_runtime_threads=1``; в ``base.yml`` эти ключи не объявлены).
  # 4 воркера — совпадает с дефолтом ops/compose/docker-compose.prod.yml
  # (``APP_WORKERS:-4``); 4 Rust-потока на воркер (используются в
  # ``granian_runtime_mode`` auto/mt — см. src/backend/main.py::_run_granian).
  workers: 4
  granian_runtime_threads: 4
  opentelemetry_endpoint: "http://otel-collector:4317"
  telemetry_enabled: true
  admin_enabled: true
  monitoring_enabled: true
  enable_swagger: false
  enable_redoc: false
  # PERF-6.6 Sprint P3: Brotli compression для JSON responses.
  # -60% bandwidth vs GZIP. Клиенты с Accept-Encoding: br получат brotli,
  # остальные GZIP fallback (per middleware chain). Lazy-import brotli pkg.
  # Wave 13 Q17: перенесено из секции `log:` — эти поля принадлежат группе
  # `app` (compression-middleware читает settings.app.*).
  compression_brotli: true
  # PERF-6.6 P15: gzip level 9 → 6 (default base=9). level 6 — CPU/Ratio
  # sweet-spot (level 9 — 2-3x slower CPU при лишь ~3-5% лучшем ratio).
  # Brotli покрывает primary compression path; gzip fallback для legacy
  # clients должен быть CPU-efficient, не storage-efficient.
  gzip_minimum_size: 512
  gzip_compresslevel: 6


security:
  # ADR-0371 (cycle 172): prod-лимиты отличаются от dev-значений из base.yml.
  # ``rate_limit`` — лимит запросов в минуту на route+dependency
  # (Redis-лимитер, entrypoints/dependencies/rate_limit.py): 1000 (dev) → 3000.
  # ``request_timeout`` — глобальный fallback TimeoutMiddleware
  # (entrypoints/middlewares/timeout.py): 20с (dev) → 30с (prod), чтобы
  # длинные интеграционные операции (SKB, загрузка файлов) не отваливались
  # по дефолтному таймауту.
  # Про ``algorithm`` (контракт ADR-0407): в prod алгоритм подписи JWT —
  # симметричный HS256. Он допустим ТОЛЬКО при гарантированном источнике
  # JWT-секрета: ``security.secret_key`` (YAML) / env ``SEC_SECRET_KEY`` /
  # Vault (``vault.enabled`` + ``addr`` + ``secret_path`` — в prod секрет
  # приходит оттуда). Без источника — CRITICAL
  # ``security.jwt_symmetric_algorithm_without_secret``
  # (``manage.py validate-profile prod`` → exit 1).
  # Переход на RS256 — отдельная owner-задача (OWNER_TASKS § 3.1): нужна
  # RSA-keypair + JWKS/IdP; без этой инфраструктуры переключение ломает
  # выпуск и проверку JWT.
  rate_limit: 3000
  request_timeout: 30.0
  # Локальный prod-drill: админ-доступ только с loopback; в реальном prod
  # инжектится env SEC_ADMIN_IPS (корпоративные CIDR).
  admin_ips: ["127.0.0.1/32", "::1/128"]
  admin_routes:
    - "/admin"
    - "/admin/*"
    - "/metrics"
  allowed_hosts:
    - "*.prod.local"


# ADR-0371 (cycle 172): интроспекция GraphQL выключена (см. base.yml).
graphql:
  enable_introspection: false


# ADR-0371 (cycle 172): Vault в prod — не loopback-plaintext.
# В base.yml стоял ``http://127.0.0.1:8200`` (dev-дефолт), и prod его
# не переопределял → в проде секреты читались с loopback по HTTP.
# Фактический адрес Vault задаётся env ``VAULT_ADDR`` (приоритет выше
# YAML); значение ниже — безопасный fallback профиля.
vault:
  addr: "https://vault:8200"


# Block 1.1 (gap-ai-1.1, ADR-0072): production-enforcement AI Safety flags.
# Каждый flag — default-OFF в base.yml; включается явным override per-profile.
# Override через env (FEATURE_*) имеет приоритет над YAML — позволяет hot-flip
# через k8s ConfigMap без передеплоя.
features:
  # S46: documented no-ops (валидатор _helpers.py:29-35), зеркало dev.yml.
  lsp_server_strict: false
  ai_prompt_sweep_strict: false
  # ADR-0063 (Accepted) — Presidio + ru NER PII layer обязателен в prod.
  presidio_pii_enabled: true
  # ADR-0393 (волна 18) — ЯВНАЯ политика capability-гейта.
  #
  # Раньше в prod флаг не был объявлен → действовал default-OFF → DSL-шаги
  # уходили в legacy-путь (sync AuthorizationGateway), который отказывает по
  # любой capability без внятной причины: отказ выглядел как «шаг сломан»,
  # а не как «доступ запрещён политикой». Одновременно БД-шаги вообще не
  # имели ``required_capability`` → любой DSL-роут читал и писал любую БД.
  #
  # Теперь:
  # * ``dsl_capability_gate_enabled: true`` — runtime-резолвер (ADR-0366):
  #   namespace = route_id роута (если capability им объявлена) →
  #   fail-closed DENY с machine-readable причиной;
  # * ``dsl_capability_core_baseline_enabled: false`` — core-baseline
  #   выключен: доступ определяется ТОЛЬКО декларациями роутов/плагинов
  #   (least privilege). Пока baseline включён, любая capability с
  #   glob-matcher'ом (``rpa.*``) выдаётся всем роутам подряд.
  #
  # Следствие (осознанное): capability ``rpa.*`` не публична и не
  # принадлежит ни одному плагину → RPA-шаги в prod отклоняются
  # fail-closed, пока роут не объявит их через плагина-владельца.
  # Это явная политика, а не случайность (ADR-0393, «Политика»).
  dsl_capability_gate_enabled: true
  dsl_capability_core_baseline_enabled: false


# B-12 fix (cycle 37) + cycle 38 Task #1: production-enforcement policy
# engines (OPA + Casbin). engine_enabled=True обязывает composition root
# инстанцировать runtime policy-цепочку и пробрасывать её в
# AuthorizationGateway. default OFF в base.yml → dev/dev_light не дёргают
# OPA/Casbin вообще (никаких сетевых вызовов при разработке).
#
# ADR-0377: здесь — ТОЛЬКО литералы. YAML-загрузчик не подставляет
# переменные окружения (а Helm эти файлы не шаблонизирует), поэтому
# плейсхолдер вида ${OPA_URL:-...} попадал в рантайм как есть: OPA-клиент
# получал невалидный URL (все решения — deny), Casbin — FileNotFoundError.
# Переопределение — через env (приоритет выше YAML, ADR-0372):
#   POLICY_OPA_URL, POLICY_CASBIN_MODEL_PATH, POLICY_CASBIN_POLICY_PATH
# (префикс POLICY_ — см. core/config/services/policy.py::PolicySettings).
# casbin_model_path маунтится через Secret в /etc/casbin/.
policy:
  engine_enabled: true
  opa_url: "http://opa:8181"
  opa_policy_name: "authz/default"
  casbin_model_path: "/etc/casbin/model.conf"
  casbin_policy_path: "/etc/casbin/policies.csv"


database:
  type: "postgresql"
  host: "postgres-prod"
  port: 5432
  name: "main_db"
  ssl_mode: "require"
  ca_bundle: null
  # Sprint 6 K2: production pool tuning (V15 R-V15-14, ADR-0059 связь).
  # 30 + 20 overflow = до 50 connections per worker; pool_recycle 30 min
  # для AWS RDS / load-balancer'ов. pool_pre_ping обязателен.
  pool_size: 30
  max_overflow: 20
  pool_recycle: 1800
  pool_timeout: 10
  pool_pre_ping: true
  pool_use_lifo: true
  # Cycle 172 (MEDIUM-09): поле ``replica_dsn`` существовало в конфиге, но
  # отсутствовало во **всех** профилях — read-replica-роутинг был выключен
  # и никогда не включался, а ``SmartSessionManager`` молча писал в primary.
  # null = «реплики нет, весь трафик идёт на primary» (поведение по
  # умолчанию). Чтобы включить — укажите async-DSN реплики. Шаблон
  # (ADR-0412 — документирован в комментарии, значение — секрет):
  #   replica_dsn: "postgresql+asyncpg://<user>:<pass>@<replica-host>:5432/<db>"
  # ВНИМАНИЕ (ADR-0377): YAML-конфиги не поддерживают env-подстановку вида
  # ${VAR:-default} — значение задаётся литералом в профиле или через
  # одноимённую env-переменную (DB_REPLICA_DSN), а не шаблоном.
  #
  # Контракт ADR-0407: ``replica_dsn: null`` — допустимое прод-значение
  # («реплика не развёрнута»), CRITICAL-не считается. Непустое значение —
  # только реальный (не loopback) хост реплики, иначе CRITICAL
  # ``database.replica_dsn_invalid`` (каждый pod использовал бы свой
  # локальный экземпляр). DSN содержит пароль → значение маскируется в
  # дампах настроек (ADR-0378 / ADR-0381).
  replica_dsn: null


external_databases:
  ssl_mode: "require"
  ca_bundle: null
  connections: []
  # Sprint 6 K2: external_databases pool tuning под нагрузкой.
  pool_size: 15
  max_overflow: 10
  pool_recycle: 1800
  pool_pre_ping: true


redis:
  enabled: true
  host: "redis-prod"
  port: 6379
  db_cache: 2
  db_queue: 3
  db_limits: 4
  db_tasks: 5
  use_ssl: true
  ca_bundle: null
  socket_keepalive: true
  main_stream: "events_stream"
  dlq_stream: "events_dlq"

  # S48 W3 fix (см. dev.yml): invoker_subscribers.py eagerly резолвит
  # get_stream_name("invocations-in") на module load; без записи стрим
  # fail-closed валит app_factory («Не настроен поток для ключа:
  # invocations-in») — профиль незагружаем. Зеркало dev-фикса владельца.
  streams:
    - {name: "invocations-in", value: "invocations-in-stream"}
    - {name: "actions", value: "actions-stream"}
    - {name: "dsl-actions", value: "dsl-actions-stream"}
    - {name: "dsl-events", value: "dsl-events-stream"}
    - {name: "email", value: "email-notification-stream"}
    - {name: "order-send", value: "order-send-to-skb-stream"}
    - {name: "order-get-result", value: "order-get-result-from-skb-stream"}
    - {name: "order-pipeline", value: "order-start-pipeline_stream"}



mongo:
  enabled: true
  host: "mongo-prod"
  port: 27017
  name: "mongo"


waf:
  # Валидатор waf.strict_required_in_prod: permissive WAF в prod запрещён.
  # allow_hosts — явный whitelist (esbgreendata из base.yml + внешние
  # интеграции).
  #
  # ADR-0412: loopback-записи удалены. Sidecar'ы (clamd, otel-collector)
  # адресуются по service-DNS (см. ``waf.clamav_host`` ниже и
  # ``app.opentelemetry_endpoint``), а в k8s ``127.0.0.1`` — это сам pod,
  # а не соседний контейнер. Loopback в allowlist теперь означал бы
  # мёртвую запись либо внешнюю интеграцию, молча указывающую на localhost
  # (CRITICAL ``waf.allow_hosts_loopback_without_local_dependency``).
  #
  # ADR-0377: добавлены хосты ВНЕШНИХ интеграций
  # (src/backend/services/integrations/**): при strict=true исходящий запрос
  # к хосту вне allowlist'а блокировался (WafBypassError) — в prod запросы
  # к СКБ-Техно и DaData идут напрямую (минуя WAF-шлюз http.waf_url),
  # поэтому интеграции были полностью сломаны.
  #
  # Контракт ADR-0407 (проверяется валидатором профиля):
  # * allow_hosts обязан покрывать хосты ВСЕХ внешних интеграций, иначе
  #   CRITICAL ``waf.allow_hosts_missing_integration_hosts`` — интеграция
  #   в проде заблокирована целиком;
  # * loopback-хост(ы) в allowlist — CRITICAL (ADR-0412: sidecar'ы в
  #   prod/staging доступны по service-DNS, loopback-зависимости в проде
  #   больше нет).
  strict: true
  allow_hosts:
    - "esbgreendata"
    # СКБ-Техно (services/integrations/skb.py → skb.prod_url)
    - "api.skb-techno.ru"
    # DaData (services/integrations/dadata.py → dadata.base_url)
    - "suggestions.dadata.ru"
  # ADR-0412: хост clamd — service-DNS имя sidecar'а (k8s Service ``clamd``,
  # deploy/k8s/service.yaml). Loopback в prod/staging — CRITICAL
  # ``waf.clamav_host_loopback_in_prod`` (в k8s это сам pod, а не clamd).
  clamav_host: "clamd"
  # ADR-0419: fail-closed. В base.yml стоял ``clamav_fail_open: true`` и prod
  # его не переопределял → при недоступном clamd запросы проходили без
  # AV-сканирования (WARNING ``waf.clamav_fail_open_in_prod``).
  #
  # В prod clamd развёрнут как sidecar (service-DNS ``clamd``), поэтому
  # «fail_open без clamd» — не штатная ситуация: если sidecar'а нет,
  # исходящие запросы блокируются (fail-closed), а не сканируются
  # «наполовину».
  #
  # Escape-hatch, если платформа не разворачивает clamd: поставить
  # ``waf.clamav_enabled: false`` — сканер не подключается вовсе, и
  # ``fail_open`` становится нерелевантным (это явный выбор, а не
  # молчаливый fail-open).
  clamav_fail_open: false


# ADR-0371 (cycle 172): TLS-проверка и лимиты соединений — prod-уровня.
# В base.yml было ``ssl_verify: false`` (сертификаты не проверялись) и
# ``limit_per_host: 20`` (dev-значение) → в проде исходящие HTTPS-запросы
# принимали любой сертификат, а пул на хост был ограничен dev-значением.
http:
  ssl_verify: true
  limit_per_host: 50

queue:
  enabled: true
  type: "rabbitmq"
  host: "rabbitmq-prod"
  port: 5672
  ui_port: 15672
  use_ssl: true
  ca_bundle: null


  # S48 W3 fix (см. dev.yml queue.queues): invoker_subscribers.py:49
  # eagerly резолвит get_queue_name("invocations-in") на module load.
  # База (order-create/order-send) не содержит нужных ключей —
  # оверлей заменяет список целиком, поэтому базовые очереди повторены.
  queues:
    - {name: "invocations-in", value: "invocations-in-queue"}
    - {name: "dsl-actions", value: "dsl-actions-queue"}
    - {name: "order-create", value: "order-init-create-queue"}
    - {name: "order-send", value: "order-send-queue"}

mail:
  host: "smtp-prod"
  port: 587
  sender: "noreply@prod.local"
  use_tls: true
  validate_certs: true
  ca_bundle: null
  template_folder: null


log:
  host: "graylog-prod"
  port: 9000
  use_tls: true
  ca_bundle: null
  # Wave 13 Q1: явный INFO — base.yml задаёт log.level=DEBUG для всех профилей,
  # без override prod/staging логировались на DEBUG.
  level: "INFO"
  # R4.LOAD OPT-1 (load-test agent, 2026-09-08): disable per-request body
  # logging в prod profile. InnerRequestLoggingMiddleware буферит и логирует
  # body каждого response — главный cost-contributor p99 440ms @ 300VU push.
  # Body-logging остаётся доступным в dev/dev_light (debugging), но OFF в prod
  # для throughput. Structured request_id propagation (X-Request-ID) сохранён.
  log_requests: false


fs:
  enabled: true
  provider: "aws"
  bucket: "prod-bucket"
  endpoint: "https://s3.prod.local"
  interface_endpoint: "https://s3-console.prod.local"
  use_ssl: true
  verify: true
  ca_bundle: null


skb:
  prod_url: "https://api.skb-techno.ru/v2/Requests/"
  test_url: "https://test-api.skb-techno.ru/v2/Requests/"


dadata:
  base_url: "https://suggestions.dadata.ru/suggestions/api/4_1/rs/"


antivirus:
  base_url: "https://kkdrweb.bank.srv:443"


# W14.5 — durable WatermarkStore. В prod используем PG (таблица
# ``streaming_watermarks`` создаётся миграцией a7b8c9d0e1f2).
watermark:
  backend: "postgres"
  persist_min_interval: 1.0

cert_store:
  backend: "vault"
  hot_cache_ttl: 300
  vault_path: "secret/certs"
  mongo_collection: "certs"
  expire_warn_days: 30
  fallback_enabled: true
  watch_enabled: true
  watch_path: "/etc/certs"


# ADR-0371 (cycle 172): локальный PG→SQLite snapshot в prod ВЫКЛЮЧЕН.
# Файл ``var/db/snapshot.sqlite`` — per-pod: в multi-replica проде каждый под
# держит свою копию (shared state между подами), а ``resilience.fallbacks.
# db_main.chain`` с ``sqlite_ro`` рассчитан на локальный файл. Корректный
# prod-fallback — read-replica PostgreSQL (``database.replica_dsn``, сейчас
# ``null`` — owner-задача).
snapshot:
  enabled: false


# ADR-0371 (cycle 172): ``open_webui`` исключён из fallback-цепочки AI.
# ADR-0412: endpoint провайдера объявлен явно — ``http://open-webui:3000``
# (service-DNS имя k8s Service, см. deploy/k8s/service.yaml). До развёртывания
# сервиса провайдер остаётся ВНЕ цепочки: откат на несуществующий endpoint
# выглядит как «LLM отвечает» (ADR-0407). Процедура включения — в
# docs/config/SETTINGS_GUIDE.md, раздел «Sidecar-DNS и endpoint-контракты».
#
# Контракт ADR-0407: в prod fallback-цепочка не должна содержать провайдера
# с loopback-``base_url`` — иначе CRITICAL
# ``ai_providers.fallback_chain_localhost``: откат молча ушёл бы на сервис,
# которого в проде нет. Цепочка ниже — только реально доступные провайдеры.
ai_providers:
  fallback_chain:
    - "perplexity"
    - "huggingface"
    - "openrouter"
    - "nim"
    - "openai"
    - "minimax"


# ADR-0412: явный endpoint провайдера OpenWebUI (service-DNS).
# Провайдер не входит в fallback-цепочку выше, пока сервис не развёрнут.
open_webui:
  base_url: "http://open-webui:3000"
