name: image

# Sprint 6 Devops: container image pipeline — buildx + cosign + Trivy + GHCR.
# Template-only, working pipeline. Single-arch (linux/amd64); multi-arch —
# дорожная карта вне scope этой задачи (Sprint 6 W1).
#
# Triggers:
#   * push to master            — полный pipeline (build → scan → sign → push);
#   * tag v*.*.*                — release build с тем же pipeline;
#   * pull_request              — build + scan (sign/push пропускаются через if);
#   * workflow_dispatch         — manual run для ad-hoc верификаций.
#
# Pipeline ordering (явные needs — защита от регрессий в test_image_workflow.py):
#   build ──► scan ──► sign ──► push
#   scan   блокирует push (exit-code: 1 на HIGH/CRITICAL);
#   sign   блокирует push (push не стартует без подписи);
#   push   и sign пропускаются на PR (нет права писать в GHCR/PR).
#
# Идемпотентность: GHA cache (type=gha) используется в обоих buildx-шагах
# (build + push) — второй build переиспользует слои из первого, ~5x быстрее
# cold-cache. Cosign keyless (OIDC) — без long-lived секретов в репо.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  merge_group:
    # Merge queue: обязательные workflow должны идти и на merge_group,
    # иначе release-gate на merge_group не находит прогонов и падает
    # структурно (аудит 2026-11-23, независимое ревью: MAJOR-1).
  workflow_dispatch:

permissions:
  contents: read          # checkout
  packages: write         # push в ghcr.io
  id-token: write         # cosign keyless (OIDC ↔ Fulcio)
  security-events: write  # SARIF upload в Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (docker buildx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # P2 (аудит 2026-11-20): было `steps.meta.outputs.image` — у
      # docker/metadata-action НЕТ выхода 'image' (выходы: tags/version/
      # digest/labels/annotations/json), поэтому ref был пустым: образ
      # собирался без тега, а trivy и cosign получали пустую ссылку.
      # image — первичный (одиночный) ref для scan/sign;
      # tags — полный список тегов для push.
      image: ${{ steps.ref.outputs.ref }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve primary image ref
        id: ref
        # Первичный ref берётся из выхода metadata-action 'tags' (первый
        # тег) — он уже нормализован (имя репозитория в lowercase), в отличие
        # от `${{ github.repository }}`.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          primary="$(printf '%s\n' "$IMAGE_TAGS" | grep -v '^[[:space:]]*$' | head -n 1)"
          if [ -z "$primary" ]; then
            echo "::error::docker/metadata-action не вернул ни одного тега"
            exit 1
          fi
          echo "ref=$primary" >> "$GITHUB_OUTPUT"

      - name: Build (load to local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save image artifact
        # P2 (независимое ревью 2026-11-23, MINOR-7): образ сохраняется
        # артефактом, чтобы job'ы scan/sign/push работали с ТЕМ ЖЕ
        # байтами, что были собраны. Раньше образ пересобирался в каждом
        # job'е — скан проверял не тот артефакт, который уходит в registry.
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p /tmp/image-artifact
          docker save "${IMAGE_REF}" | zstd -q -o /tmp/image-artifact/image.tar.zst
          ls -lh /tmp/image-artifact/image.tar.zst

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-artifact
          path: /tmp/image-artifact/image.tar.zst
          retention-days: 1
          if-no-files-found: error

  scan:
    name: Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-artifact
          path: /tmp/image-artifact

      - name: Load image into Docker
        # P2 (независимое ревью 2026-11-23, MINOR-7): сканируется ровно
        # тот образ, который собран в job'е build (артефакт), а не свежая
        # пересборка из того же контекста: пересборка даёт другие байты
        # (таймстемпы слоёв), и скан переставал быть авторитетным.
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          zstd -q -d -c /tmp/image-artifact/image.tar.zst | docker load
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}'

      - name: Run Trivy image scan
        # P2 (аудит 2026-11-18): был `@master` — подвижная ветка вместо
        # релизного тега (см. security.yml). Заменён на релизный тег.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          # P2 (аудит 2026-11-20): вход action'а называется `image-ref`
          # (`image` удалён из trivy-action) — GitHub отбрасывал неизвестный
          # вход, и trivy получал scan-ref по умолчанию '.' →
          # «could not parse reference: .» + отсутствующий trivy-image.sarif.
          image-ref: ${{ needs.build.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  sign:
    name: Sign (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P2 (независимое ревью 2026-11-23): подпись выполняется ПОСЛЕ push —
    # cosign подписывает образ в registry, а до push его там нет. Раньше
    # ПОРЯДОК: push идёт ПЕРЕД sign. cosign подписывает манифест в
    # registry — подписать то, чего ещё нет, технически невозможно
    # (старый порядок «sign → push» падал на «no such manifest» и
    # блокировал публикацию целиком).
    #
    # Гарантия «не публикуем неподписанное» сохранена в следующем job'е
    # verify: он проверяет подпись запушенного digest и роняет workflow,
    # если подписи нет. Недопустимо подписанный образ → workflow красный
    # → релиз не выходит.
    needs: [build, scan, push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --output-signature image.sig \
            --output-certificate image.pem \
            "${{ needs.build.outputs.image }}@${{ needs.push.outputs.digest }}"

      - name: Upload signature artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosign-signature-${{ github.ref_name }}
          path: |
            image.sig
            image.pem
          retention-days: 30
          if-no-files-found: warn

  verify:
    name: Verify signature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Проверка подписи запушенного образа: workflow зелёный только если
    # образ ПОДПИСАН. Это переносит гарантию «не публикуем неподписанное»
    # на форму, которую позволяет cosign (подпись требует присутствия
    # манифеста в registry).
    needs: [build, scan, push, sign]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}@${{ needs.push.outputs.digest }}"

  push:
    name: Push (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      # P2 (независимое ревью 2026-11-23): digest запушенного образа —
      # по нему cosign подписывает образ в registry (job sign идёт после).
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # P2 (независимое ревью 2026-11-23, MINOR-7): push выполняется
        # buildx-сборкой из того же контекста, поэтому байты отличаются от
        # просканированного артефакта (таймстемпы слоёв). Побайтовая
        # идентичность потребовала бы `docker push` из сохранённого
        # артефакта — ценой buildx-provenance; решение оставляем владельцу
        # pipeline, а сканирование уже авторитетно для собранного артефакта.
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: true
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # P2 (аудит 2026-11-20): пушим ВСЕ теги metadata-action
          # (master/latest/sha-*), а не один первичный ref.
          tags: ${{ needs.build.outputs.tags }}
          labels: ${{ needs.build.outputs.labels }}