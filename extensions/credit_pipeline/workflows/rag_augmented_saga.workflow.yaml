# Workflow DSL: rag_augmented_saga
#
# ADR-0403 (волна 21): activity-имена приведены к реально существующим
# targets. До фикса шаги ссылались на несуществующие activity
# (``fetch_credit_data``, ``rag_query_legal_policies``,
# ``llm_credit_decision``, ``fund_account``, ``refund_account``) — ни в
# action-реестре ядра, ни среди ``module:fn``-ссылок расширения их не
# было, поэтому build-time резолв (ADR-0398,
# ``collect_activities(declarations, validate=True)``) ронял подъём
# Temporal-Worker'а со списком неизвестных имён.
#
# Соответствие (бизнес-логика потока — порядок шагов, saga, wait_signal —
# не менялась):
#   fetch_credit_data          → skb:fetch_result        (данные бюро)
#   rag_query_legal_policies   → rag.search              (RAG-поиск)
#   llm_credit_decision        → agents:decision_agent   (решение)
#   fund_account               → webhook.schedule        (forward)
#   refund_account             → webhook.cancel          (компенсация)
#
# ADR-0409 (волна 22): приведён к реальной семантике.
#   * payload передаётся ПЛОСКИМ (``call_function`` → ``fn(payload)``):
#     вложенный ``body``/``responses`` больше не используются — они не
#     доходили до цели (fetch_result/apply_rules читали ключи верхнего
#     уровня и падали/молчали);
#   * decision_agent получает РЕАЛЬНЫЙ вывод scoring_agent (steps.2),
#     а не RAG-выдачу — раньше credit_score=0, то есть кредит
#     отклонялся всегда (fail-closed не туда);
#   * saga-компенсация (``webhook.cancel``) берёт schedule_id из входа
#     workflow: результат forward-шага в compensate не передаётся
#     (в workflow-DSL нет передачи result'а между шагами).
#
# Ledger-операции кредитного конвейера (fund/refund) в расширении не
# реализованы — пара forward/компенсация переведена на единственную
# реальную пару «создать/отменить» ядра (webhook.schedule/webhook.cancel).
# Owner-задача: реализовать ledger в credit_pipeline (ADR-0403 §Открытое).
name: rag_augmented_saga
version: "1.0"
description: |
  RAG-augmented credit assessment saga (Sprint 12 K4 W1).

  Шаги:
    1. Fetch credit data (внешний bureau).
    2. RAG query — legal/policy база через ``rag.search``.
    3. Scoring — rule-based score заявки.
    4. LLM-decision через decision_agent (structured output).
    5. Saga: fund_account / compensate refund_account.

  Template tags: ai, rag, saga, credit, compensation.
default_timeout_s: 300
steps:
  - type: activity
    name: extensions.credit_pipeline.services.clients.skb:fetch_result
    args:
      order_uuid: "${{ order_uuid }}"
      response_type_str: "JSON"
    timeout_s: 60
  - type: activity
    name: rag.search
    args:
      query: "${{ applicant_id }}"
      namespace: "legal_policies"
      top_k: 5
    timeout_s: 30
  - type: activity
    name: extensions.credit_pipeline.agents:scoring_agent
    args:
      applicant_id: "${{ applicant_id }}"
      amount: "${{ loan_amount }}"
      duration_months: "${{ term_months }}"
      monthly_income: "${{ monthly_income }}"
    timeout_s: 60
  - type: activity
    name: extensions.credit_pipeline.agents:decision_agent
    args:
      applicant_id: "${{ applicant_id }}"
      scoring_agent: "${{ steps.2 }}"
    timeout_s: 60
  - type: saga
    forward:
      - name: webhook.schedule
        args:
          url: "${{ credit_callback_url }}"
          payload:
            applicant_id: "${{ applicant_id }}"
        timeout_s: 60
    compensate:
      - name: webhook.cancel
        args:
          schedule_id: "${{ schedule_id }}"
        timeout_s: 30
