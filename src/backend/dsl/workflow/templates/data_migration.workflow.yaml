name: data_migration
version: "1.0"
description: |
  Data Migration — snapshot → transform → upsert → verify → rollback-on-fail.
  Template tags: migration, snapshot, saga, verification.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: saga
    forward:
      - name: orders.list
        args: {limit: 1000, by: id, order: asc}
        timeout_s: 600
      - name: analytics.query
        args: {sql: "SELECT * FROM orders"}
        timeout_s: 1800
      - name: connector.import
        args: {payload: {}}
        timeout_s: 1800
      - name: analytics.count
        args: {table: orders}
        timeout_s: 300
    compensate:
      - name: replay.bulk
        args: {status_filter: stored}
        timeout_s: 600
