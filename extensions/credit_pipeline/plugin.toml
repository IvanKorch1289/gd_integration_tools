# V11 plugin manifest — extensions/credit_pipeline
# Sprint 7 Team T2: scaffold → Sprint 7+ Team T3 реализация.
# Формат: ADR-042 (plugin.toml schema), ADR-044 (capability vocabulary).
#
# Cycle-17 (D-AUDIT-1704): pre-cycle-17 README/plugin.toml содержали stale
# TODO Team T3 (Sprint 8+) блок — все перечисленные сущности реализованы:
#   * SKB client → extensions/credit_pipeline/services/clients/skb.py ✓
#   * normalize.py → extensions/credit_pipeline/functions/normalize.py ✓
#   * domain/models.py → extensions/credit_pipeline/domain/models.py ✓
# См. ``extensions/credit_pipeline/README.md`` для актуальной структуры.

name = "credit_pipeline"
version = "0.1.0"
requires_core = ">=0.2,<0.3"
entry_class = "extensions.credit_pipeline.plugin.CreditPipelinePlugin"
tenant_aware = true
description = "Credit pipeline plugin (S76 — real agents: score/parse/decide)"

# Cycle-17 (D-AUDIT-1701): declare SQLAlchemy ORM models для Alembic
# auto-discovery (env.py теперь сканирует ``extensions/*/plugin.toml``
# и импортирует каждый путь в ``models_module``). Раньше Alembic
# autogenerate видел только 4 hardcoded core_entities — drift
# плагинов не обнаруживался до prod.
models_module = [
    "extensions.credit_pipeline.domain.models",
]

[[capabilities]]
name = "db.read"
scope = "credit_reports"

[[capabilities]]
name = "db.write"
scope = "credit_reports"

[[capabilities]]
name = "db.read"
scope = "credit_applications"

[[capabilities]]
name = "db.write"
scope = "credit_applications"

# mq.publish — GlobScopeMatcher: события кредитного процесса.
[[capabilities]]
name = "mq.publish"
scope = "credit.events.*"

# Cycle-90 (D-AUDIT-9001): net.outbound capabilities для external API
# (SKB credit bureau, NBKI scoring). WAF enforces эти scopes per tenant.
[[capabilities]]
name = "net.outbound"
scope = "*.skb-techno.ru"

[[capabilities]]
name = "net.outbound"
scope = "*.nbki.ru"

# ─── Декларативный inventory ──────────────────────────────────────
# S76 W2: 3 real actions (scoring, document_parser, decision agents).
# Cycle-15 (D-AUDIT-1506): ``endpoints`` секция — декларативная
# per-protocol регистрация. tools/check_protocol_sync использует для
# parity-гейта (REST/GraphQL/gRPC/MCP).
[provides]
actions = [
    "credit_pipeline.score",
    "credit_pipeline.parse",
    "credit_pipeline.decide",
]
repositories = []
processors = []
sources = []
sinks = []
schemas = []

[[provides.endpoints]]
protocol = "rest"
name = "credit_pipeline.score"
path = "/api/v1/auto/credit_pipeline.score"
method = "POST"

[[provides.endpoints]]
protocol = "graphql"
name = "credit_pipeline_score"
path = "Mutation.credit_pipeline_score"
method = ""

[[provides.endpoints]]
protocol = "grpc"
name = "credit_pipeline_score"
path = "credit_pipeline.CreditPipelineService/Score"
method = ""

[[provides.endpoints]]
protocol = "mcp"
name = "credit_pipeline.score"
path = "mcp.credit_pipeline.score"
method = ""
