# Multi-version docs publish to GitHub Pages (B2: mkdocs canonical — M10.2).
#
# Migration history: sphinx → mkdocs (FW3 deprecated sphinx; B2 fully
# removes it). mkdocs-material с mike (gh-deploy) заменяет связку
# sphinx-multiversion + peaceiris/actions-gh-pages@v3.
#
# Триггеры: push в master + любой tag v* (release).
# Build: uv sync --extra docs + mkdocs build → site/.
# Deploy: mike (mkdocs plugin) → ветка gh-pages, history через tags.
#
# ⚠ В первом релизе требуется одноразовое включение в GitHub repo settings:
#   Settings → Pages → Source = "GitHub Actions" (НЕ "Deploy from branch").

name: docs-publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # для push в gh-pages
  pages: write
  id-token: write

concurrency:
  group: docs-publish
  cancel-in-progress: false   # релиз-теги не отменяем половиной пути

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (полная история — для mike по тегам)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs deps
        run: uv sync --frozen --extra docs

      - name: Build mkdocs site
        run: uv run mkdocs build --clean --strict

      - name: Deploy to GitHub Pages (mike handles versions + alias)
        uses: mhausenblas/mkdocs-deploy-gh-pages-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          fail_on_error: true
          mkdocs_yml: mkdocs.yml
          mike_version: latest
          mike_keep_history: true
          mike_alias: latest
          mike_push: true
          mike_git_push_options: --force
