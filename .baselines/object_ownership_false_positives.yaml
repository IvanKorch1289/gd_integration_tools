      идентификатору и НЕ чтение чужого объекта: строка уже получена тем же
      tenant-scoped запросом. Назначение PK — технический, не tenant-идентификатор.
    owner: gd_integration_tools/infrastructure
    review_date: "2027-04-28"
    added_at: "2026-10-29"
