# V11 plugin manifest — extensions/core_entities/users
# Sprint 7 (R-V15-16): миграция CRUD-ресурса User из ядра в extensions/.
#
# Формат: ADR-042 (plugin.toml schema), ADR-044 (capability vocabulary).

name = "core_entities_users"
version = "1.0.0"
requires_core = ">=0.20,<0.21"
entry_class = "extensions.core_entities.users.plugin.UsersPlugin"
tenant_aware = false
description = "User CRUD plugin (migrated from src/backend/services/core/users.py per R-V15-16)"
# S18 W12 (ADR-NEW-6): core entities (internal trusted) → Tier-A.
trust_tier = "A"

# SQLAlchemy ORM-модуль для auto-discovery при миграциях (cycle-15).
# Top-level поле ``PluginManifest.models_module``. ``User`` объявлен в
# ``domain/models.py`` и наследует ``BaseModel`` из
# ``src.backend.core.domain.models.base``. Регистрация таблицы на
# ``Base.metadata`` происходит side-effect при импорте этого модуля.
models_module = ["extensions.core_entities.users.domain.models"]

# ─── Runtime capabilities (capability-gate) ───────────────────────
[[capabilities]]
name = "db.read"
scope = "users"

[[capabilities]]
name = "db.write"
scope = "users"

# ─── Декларативный inventory ──────────────────────────────────────
[provides]
repositories = ["users"]
schemas = ["UserSchemaIn", "UserSchemaOut", "UserVersionSchemaOut"]
