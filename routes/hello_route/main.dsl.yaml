route_id: hello_route
source:
  http:
    method: POST
    path: /api/v1/CHANGEME
steps:
- # D-AUDIT-B-102 fix (cycle 1): broken call_function step удалён (модуль
  # не существует — route — pure YAML demo).
- policy:
    retry:
      attempts: 3
      backoff: exponential
      max_delay_ms: 5000
- llm_call:
    provider: claude
    model: claude-3-5-sonnet-20241022
    prompt_from: body.context
    result_property: ai_response
    dry_run_provider: mock-llm
- http_call:
    url: https://api.test/sink
    method: POST
- audit:
    action: hello_route.processed
- to:
    response:
      code: 200
      body: ${body}
