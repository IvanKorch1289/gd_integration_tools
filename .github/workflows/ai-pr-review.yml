name: AI PR Review
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - src/**/*.py
    - tests/**/*.py
    - manage.py
    - pyproject.toml
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: false
        type: string
# P2 (аудит 2026-11-18): блок permissions отсутствовал → workflow наследовал
# дефолтные права токена репозитория (часто read/write). Явный минимум:
# читать код + писать комментарий в PR.
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  pre-checks:
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changes.outputs.files }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'
    - id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: "files:\n  - \"src/**/*.py\"\n  - \"tests/**/*.py\"\n  - \"manage.py\"\
          \n  - \"pyproject.toml\""
  review:
    needs: pre-checks
    if: needs.pre-checks.outputs.files_changed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    - name: Sync deps
      run: uv sync --locked

    - name: Run linting checks
      run: uv run ruff check src/ tests/
      continue-on-error: true
    - name: Check type safety
      run: uv run mypy src/
      continue-on-error: true
    - name: Run security scan
      run: uv run bandit -r src/ -f json -o bandit_report.json
      continue-on-error: true
    - name: Run tests
      run: uv run pytest tests/ -x -q --tb=short
      continue-on-error: true
    - name: Check coverage delta
      run: uv run pytest tests/ --cov=. --cov-report=json:coverage.json -q
      continue-on-error: true
    - name: AI checks (STUB — реальные проверки не реализованы)
      # P1 (аудит 2026-11-18): шаги «AI Layer Policy Check», «AI Security
      # Check» и «AI Performance Regression Check» были заглушками вида
      # `python -c "print('...: PASS')"` — они ВСЕГДА печатали PASS, ничего
      # не проверяя, и в логе CI выглядели как пройденные гейты
      # (fail-open по сути). Заменены одним явным шагом-заглушкой с
      # warning-аннотацией: сигнала он не даёт и не должен выдавать.
      #
      # Реальные гейты безопасности/политик живут в других workflow:
      #   lint.yml    → check_decorative_capabilities, check_tenant_isolation,
      #                 check_object_authorization, check_waf_coverage
      #   security.yml → bandit (HIGH — blocking), pip-audit, uv audit
      run: |
        echo "::warning::AI Layer/Security/Performance checks are not implemented — no signal produced (see lint.yml / security.yml for the real gates)"
    - name: Generate AI Review Comment
      if: github.event_name == 'pull_request'
      run: uv run python -c "from datetime import datetime; open('review_comment.md','w').write('##
        AI PR Review Summary\\n\\nAll checks completed.\\n\\n---\\n*AI-generated*')"
    - name: Post Review Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: 'const fs = require(''fs''); const comment = fs.readFileSync(''review_comment.md'',
          ''utf8''); github.rest.issues.createComment({ issue_number: context.issue.number,
          owner: context.repo.owner, repo: context.repo.repo, body: comment });'
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pr-review-artifacts
        path: 'bandit_report.json

          coverage.json

          review_comment.md'
        retention-days: 7
