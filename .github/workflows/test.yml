name: test

# Sprint 3 W1 К5 / GAP-10: запуск pytest + coverage artifact.
# Codecov upload — опционален (только если задан secret CODECOV_TOKEN).

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    # Merge queue: обязательные workflow должны идти и на merge_group,
    # иначе release-gate на merge_group не находит прогонов и падает
    # структурно (аудит 2026-11-23, независимое ревью: MAJOR-1).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    # Docker daemon доступен на ubuntu-latest по умолчанию (testcontainers).
    # При необходимости — добавить services: { docker: dind } для self-hosted runners.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: часть тестов (changelog-autogen) работает с
          # `git log HEAD~3..HEAD` — на shallow clone такого ref не существует.
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          # TODO: при недоступности 3.14 — fallback на '3.14-dev' или '3.13'.
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps
        # P2 (аудит 2026-11-20): extra sources-cdc обязателен — в нём живёт
        # sync-драйвер PostgreSQL (psycopg, дефолт database.sync_driver).
        # Без него settings.model_dump() (admin-эндпоинт конфигурации)
        # падает с DatabaseDriverError — тесты получают 500 вместо 200.
        # db_drivers: без него 13 DSN-тестов падают с «Драйвер 'pyodbc'
        # объявлен в extra 'db_drivers', но не установлен в текущем
        # окружении» (базовая линия 2026-11-23).
        # workflow: Temporal SDK нужен dsl/workflow-тестам; без него они
        # падают с ModuleNotFoundError: No module named 'temporalio'
        # (эти группы не выполнялись, пока первая группа не падала).
        # dsl-extras-2: standardwebhooks (библиотечный путь проверки
        # подписи webhook'ов; без него тест реплея пропускается).
        # mcp: fastmcp — без него MCP-тесты падают с «fastmcp is not
        # installed» (extra лёгкий: только fastmcp).
        run: uv sync --locked --extra sources-cdc --extra db_drivers --extra workflow --extra dsl-extras-2 --extra mcp

      - name: Run pytest with coverage (grouped, ADR-0453)
        # ADR-0453: монолитный `pytest tests --cov=src/backend` на 24k тестов
        # упирается в память (OOM) — покрытие считается по группам, части
        # объединяются через `coverage combine` (цифра сопоставима).
        run: |
          chmod +x tools/run_coverage_grouped.sh
          uv run tools/run_coverage_grouped.sh --out coverage.xml
          uv run coverage report | tail -20

      - name: "Diagnostics: CLI help in CI environment"
        # Диагностика для оставшихся env-специфичных падений группы
        # tests/unit/tools (typer/rich-help): локально help отдаёт флаги, в CI
        # — нет. Снимок вывода того же CLI в том же окружении позволяет
        # сравнить рендеринг и найти различие (версия Python, состав extras,
        # TTY) без спекулятивного ослабления проверок.
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          for cli in tools/check_coverage_gate.py tools/check_feature_flags.py tools/check_env_example.py; do
            name="$(basename "${cli}" .py)"
            uv run python "${cli}" --help > "artifacts/diagnostics/${name}.help.txt" 2>&1 || true
          done
          {
            echo "--- python ---"
            uv run python -VV 2>&1 || true
            echo "--- packages ---"
            uv run python -m pip list 2>/dev/null | grep -Ei "^(typer|click|rich|fastmcp|standardwebhooks|temporalio) " || true
            echo "--- terminal env ---"
            echo "COLUMNS=${COLUMNS:-<unset>} TERM=${TERM:-<unset>} CI=${CI:-<unset>}"
          } > artifacts/diagnostics/env.txt 2>&1 || true
          ls -la artifacts/diagnostics || true

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: artifacts/diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Coverage gate ([wave:s19/k2-w4-coverage-ratchet-75])
        # S19 K2 W4 / ADR-0443 — coverage gate ratchet.
        # Порог берётся из baseline (.baselines/coverage.json) — single
        # source of truth: раньше CI задавал --threshold 75 явно и был
        # красным при фактическом coverage 74 %.
        # Любое падение coverage > 0.5% от baseline блокирует CI в --strict.
        #
        # ВАЖНО: `main` — обязательный subcommand. Инструмент мигрирован на
        # typer (commands: main / per-layer); плоский вызов без `main`
        # завершается с exit 2 (usage error), и гейт молча НЕ проверял
        # coverage вообще. Канонический вызов — как в make/docs.mk.
        run: |
          uv run python tools/check_coverage_gate.py main \
              --coverage-xml coverage.xml \
              --baseline .baselines/coverage.json \
              --strict

      - name: Release evidence (manifest + локальные проверки)
        # Аудит 2026-11-20, этап 6: вместо ручного «процента готовности»
        # собирается машинно-читаемый manifest: SHA, профиль, состав
        # проверок, коды возврата, хеши артефактов, внешние блокеры и
        # вычисленный вердикт (READY_RC только при зелёных проверках,
        # чистом дереве и отсутствии блокеров).
        #
        # Внутри выполняются локальные детерминированные проверки
        # (без сети и БД): HTTP-контракт на живом uvicorn И на Granian —
        # продовом рантайме (ADR-0059); контракт зависит от HTTP-стека
        # сервера, а не только от middleware (политика кэша,
        # условный GET, инкрементальная доставка SSE, сжатие, tenant) и
        # бизнес-workflow СКБ на mock'е внешнего сервиса (заказ → id →
        # результат → документ с контрольной суммой, идемпотентность,
        # recovery). Их логи сохраняются как артефакты рядом с manifest'ом.
        run: |
          uv run python tools/checks/release_evidence.py \
            --profile ci \
            --scope "contract:tools/checks/http_contract_smoke.py" \
            --scope "business-workflow:tools/checks/skb_mock_e2e.py" \
            --scope "unit:tests/unit/entrypoints" \
            --command "http-contract-smoke:python tools/checks/http_contract_smoke.py" \
            --command "http-contract-smoke-granian:python tools/checks/http_contract_smoke.py --server granian" \
            --command "skb-mock-e2e:python tools/checks/skb_mock_e2e.py" \
            --out artifacts/release/evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: artifacts/release/
          if-no-files-found: warn

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload to Codecov (optional)
        # Шаг исполняется только когда задан CODECOV_TOKEN.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
