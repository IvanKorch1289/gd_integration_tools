# ReadTheDocs Build Configuration (B2: mkdocs canonical — M10.2).
#
# Migration history: sphinx → mkdocs (FW3 deprecated sphinx; B2 fully
# removes it). ReadTheDocs теперь строит каждую активную версию через
# mkdocs. Sphinx-multiversion больше не используется (FW3 deprecation
# + B2 removal of docs/conf.py + docs/Makefile).

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
  jobs:
    pre_install:
      - pip install uv
    install:
      - uv sync --frozen --extra docs
    build:
      html:
        - uv run mkdocs build --clean --strict

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

formats:
  - htmlzip
  - pdf
