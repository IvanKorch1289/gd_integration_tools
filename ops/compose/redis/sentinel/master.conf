# Redis master configuration (S60 W1 local development).
# Used by docker-compose.redis-sentinel.yml for local Sentinel testing.
# DO NOT use in production — for production see
# docs/security/REDIS_HA_INFRASTRUCTURE_REQUIREMENTS.md.

# Persistence
appendonly yes
appendfsync everysec

# Replication (master allows replicas to connect)
replica-serve-stale-data yes
replica-read-only no  # master itself is read/write

# Network
bind 0.0.0.0
protected-mode no  # local dev only
