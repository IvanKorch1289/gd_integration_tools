# V11 plugin manifest — extensions/osint_agent
name = "osint_agent"
version = "0.1.0"
requires_core = ">=0.20,<0.21"
entry_class = "extensions.osint_agent.plugin.OsintAgentPlugin"
tenant_aware = true
description = "OSINT agent: web-search + LLM report generation by INN"
trust_tier = "B"

# Whitelist модулей для DSL-шага call_function (Sprint 226, 2026-10-06).
# Этот плагин — провайдер единственного модуля, который использует
# ``call_function`` в routes/osint_agent/osint.dsl.yaml. Без этой
# декларации шаг упадёт с PermissionError в strict-режиме
# (call_function_whitelist_strict=True — дефолт).
call_function_modules = [
    "extensions.osint_agent.functions.osint_workflow",
]

[[capabilities]]
name = "net.outbound"
scope = "*.perplexity.ai"

# ai.llm отсутствовал в capability-vocabulary (ADR-044) — плагин падал при
# загрузке с CapabilityNotFoundError. Каноническое имя для вызова LLM через
# AIGateway — `ai.invoke`, scope = workflow_id pattern или `*`.
[[capabilities]]
name = "ai.invoke"
scope = "*"

[provides]
actions = [
    "osint_agent.report",
]
repositories = []
processors = []
sources = []
sinks = []
schemas = []