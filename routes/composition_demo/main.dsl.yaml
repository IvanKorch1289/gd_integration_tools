# Main composition demo route
# Demonstrates include: and extends: composition (S19 K3 W2)

extends: ./base_transforms.yaml

include:
  - ./shared_steps.yaml

route_id: composition.demo
source: http:POST /api/v1/composition/demo
description: Composition demo — extends base + includes shared steps

steps:
  # P2-D8 (audit 2026-08-18): feature flag gate для composition demo.
  - feature_flag:
      flag: demo_routes_enabled
      default: true
      stop_on_disabled: false
      output_field: demo_active
  - audit:
      action: "route.composition_demo.start"
  - audit:
      action: "route.composition_demo.complete"

# Блок ``to: {response: {...}}`` удалён 2026-10-06. Response-binding в DSL
# НЕ реализован: у ``Pipeline`` нет такого поля, у ``RouteBuilder`` нет
# метода, а ``_build_pipeline()`` ключ ``to`` просто не читает — он молча
# игнорировался, и блок обещал контракт ответа, которого не существует.
# Пробел зафиксирован в аудите как GAP (ADR на response-binding).
#
# Из-за этого роут возвращает тело, прошедшее через шаги, а не задуманный
# ``{status: composed, ...}``.