# Redis Sentinel configuration (S60 W1 local development).
# Used by docker-compose.redis-sentinel.yml for local Sentinel testing.

# Network
bind 0.0.0.0
protected-mode no  # local dev only

# Logging
logfile ""
loglevel notice

# Sentinel works in monitor mode — flags passed via docker-compose CMD:
# --sentinel monitor gd-mobile-redis redis-master 6379 2
# --sentinel auth-pass gd-mobile-redis redis-dev-password
# --sentinel down-after-milliseconds gd-mobile-redis 5000
# --sentinel failover-timeout gd-mobile-redis 10000
# --sentinel parallel-syncs gd-mobile-redis 1
