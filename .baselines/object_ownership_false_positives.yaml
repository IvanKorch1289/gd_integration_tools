    owner: gd_integration_tools/dsl
    review_date: "2027-04-29"
    added_at: "2026-10-29"
  - file: src/backend/dsl/workflow/bpmn_importer.py
    line: 529
    reason: >
      ``elements.get(node_id)`` — локальная карта разобранного BPMN-XML (см.
