    owner: gd_integration_tools/dsl
    review_date: "2027-04-29"
    added_at: "2026-10-29"
  - file: src/backend/infrastructure/cdc/poll_backend.py
    line: 338
    reason: >
      ``row.get(pk_column)`` в polling-стратегии CDC — извлечение значения
