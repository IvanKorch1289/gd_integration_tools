name: release

# Sprint 3 W1 К5 / GAP-10: release dry-run.
# PyPI publish — отложен на R3. Cosign attestation образа — реализована
# (аудит 2026-11-23, ЭТАП 4): manifest связывается с digest'ом и
# подписанным свидетельством.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # cosign keyless → OIDC-токен (Fulcio) и запись attestation'а в
      # registry (GHCR) — без них релизное свидетельство неполно
      # (аудит 2026-11-23, ЭТАП 4).
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Нужна полная история для корректного построения версии.
          fetch-depth: 0

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          # TODO: при недоступности 3.14 — fallback на '3.14-dev' или '3.13'.
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps
        run: uv sync --locked

      - name: Build distribution (sdist + wheel)
        id: build_dist
        run: uv build

      - name: Release notes (changelog_autogen)
        # Пункт плана волны 35/36: инструмент release-notes был реализован,
        # но не был подключён — `make release-notes` падала (инструмента нет),
        # и notes не генерировались вовсе.
        run: |
          uv run python tools/changelog_autogen.py \
            --from "${PREV_TAG:-}" \
            --output dist/release-notes.md \
            --title "Release notes" || \
            echo "release notes skipped (нет предыдущего тега)"
        continue-on-error: true

      - name: Twine check (метаданные dist/*)
        # Dry-run верификация артефактов; реальная публикация — отложена на R3.
        id: twine_check
        run: uv run twine check dist/*

      - name: Generate SBOM (CycloneDX)
        id: sbom
        # D-AUDIT-11-5 fix (cycle 1): canonical path — dist/sbom/sbom.cdx.json
        # (3-way drift fixed: make/security.mk + tools/checks/* теперь пишут в dist/sbom/,
        #  не в legacy dist/sbom.cdx.json).
        run: |
          uv run python tools/checks/generate_sbom.py \
            --output-dir dist/sbom
        continue-on-error: false

      - name: pip-audit dependency vulnerability scan
        id: pip_audit
        run: |
          uv run pip-audit --strict --output dist/pip-audit.json \
            --format json || true
        continue-on-error: true

      - name: Cosign sign artifacts
        id: cosign
        # Sprint 9 K1 W5: cosign keyless sign через OIDC
        # Активируется только если COSIGN_EXPERIMENTAL=1 и Sigstore доступен
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          if command -v cosign >/dev/null 2>&1; then
            uv run python tools/checks/cosign_sign_all.py \
              --dist-dir dist/ \
              --keyless || echo "cosign sign skipped (sigstore unavailable)"
          else
            echo "cosign not installed; skipping signing"
          fi
        continue-on-error: true

      - name: Resolve image name
        id: imagename
        # Владелец репозитория — «IvanKorch1289» (смешанный регистр),
        # а ghcr.io требует lowercase.
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "name=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Attest image (in-toto)
        # Attestation связывает релизное свидетельство с конкретным образом
        # по digest. Без него манифест не может считаться подтверждённым
        # (tools/checks/release_evidence.py → вердикт BLOCKED).
        id: attest
        env:
          IMAGE_REF: ghcr.io/${{ steps.imagename.outputs.name }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE_REF}" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest",""))' 2>/dev/null || true)"
          if [ -z "${digest}" ]; then
            echo "::warning::digest образа не разрешён — attestation пропущена"
            exit 0
          fi
          cosign attest --yes \
            --predicate dist/sbom/sbom.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}@${digest}"
          mkdir -p artifacts/release
          printf '%s@%s' "${IMAGE_REF}" "${digest}" > artifacts/release/attestation.ref
          echo "attestation=${IMAGE_REF}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Release evidence manifest
        # Аудит prod-readiness (2026-11-20), этап 6: машинный manifest о
        # готовности релиза — вместо ручного «процента готовности» в отчётах.
        # Связывает в одном месте: SHA тега, профиль, образ (digest), состав
        # проверок с кодами возврата, хеши артефактов и внешние блокеры.
        #
        # Digest образа резолвится из registry (docker buildx imagetools
        # inspect): в release-джобе образа локально нет, он уже отправлен в
        # ghcr.io. Если образ недоступен — остаётся явный 'n/a', а не молчание.
        env:
          # Имя репозитория в ghcr.io обязано быть lowercase: иначе
          # «docker buildx imagetools inspect» отвергает ссылку, и digest
          # в манифесте остаётся 'n/a'. Шаг Resolve image name приводит
          # имя к нижнему регистру.
          IMAGE_REF: ghcr.io/${{ steps.imagename.outputs.name }}:${{ github.ref_name }}
        run: |
          uv run python tools/checks/release_evidence.py \
            --profile release \
            --image "${IMAGE_REF}" \
            --scope "dist:uv build" \
            --scope "metadata:twine check" \
            --scope "sbom:generate_sbom.py" \
            --scope "audit:pip-audit" \
            --scope "sign:cosign_sign_all.py" \
            --record "dist:uv build=${{ steps.build_dist.outcome }}" \
            --record "metadata:twine check=${{ steps.twine_check.outcome }}" \
            --record "sbom:generate_sbom.py=${{ steps.sbom.outcome }}" \
            --record "audit:pip-audit=${{ steps.pip_audit.outcome }}" \
            --record "sign:cosign=${{ steps.cosign.outcome }}" \
            --record "attest:cosign_attest=${{ steps.attest.outcome }}" \
            --artifact dist/sbom/sbom.cdx.json \
            --attestation "${{ steps.attest.outputs.attestation || 'n/a' }}" \
            --artifact dist/pip-audit.json \
            --artifact dist/release-notes.md \
            --out dist/release-evidence.json

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: |
            dist/
            !dist/*.cdx.json
            !dist/*.sig
            !dist/*.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload release evidence
        # Манифест релиза: машинно-читаемое доказательство состава прогона.
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}
          path: dist/release-evidence.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload SBOM + signatures
        uses: actions/upload-artifact@v7
        with:
          name: sbom-and-signatures-${{ github.ref_name }}
          path: |
            dist/*.cdx.json
            dist/*.sig
            dist/pip-audit.json
          retention-days: 90
          if-no-files-found: warn

      # TODO (R3 / Sprint 10+): активировать публикацию
      #   - uv run twine upload dist/*.whl dist/*.tar.gz --repository <pypi>
      # после secret PYPI_TOKEN + явный approval.
