apiVersion: batch/v1
kind: Job
metadata:
  name: gd-migration
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: gd-integration-tools
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-completed
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gd-integration-tools
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: {{ .Values.app.serviceAccount.name }}
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Alembic invocation. ``-c alembic.ini`` обязателен: ``python -m
          # alembic`` без ``-c`` находит ``alembic.ini`` только если CWD = /app,
          # что зависит от WORKDIR образа. Явный ``-c`` делает Job идемпотентным
          # относительно WORKDIR и совпадает с deploy/k8s/jobs/migration.yaml
          # (где уже было ``alembic -c alembic.ini upgrade head``). K-OPS-4 fix.
          command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: gd-app-config
            - secretRef:
                name: gd-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
