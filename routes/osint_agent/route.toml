# route.toml (V11): manifest for route 'osint_agent'
#
# ADR-0405: capability объявляются структурированно — [[route.capabilities]]
# с отдельными полями name/scope (ADR-0078/ADR-0366). Legacy-форма
# "ai.invoke:*" прятала scope внутрь имени — по новой модели имя берётся
# из vocabulary ("ai.invoke"), а scope живёт в отдельном поле.
[route]
name = "osint_agent"
version = "0.1.0"
requires_core = ">=0.20,<0.21"
pipelines = ["osint.dsl.yaml"]
tenant_aware = true
feature_flag = { enabled = true, gate = "osint_agent_enabled" }
slo = { p95_ms = 5000, timeout_ms = 30000 }
schedule = "never"

# scope обязателен: плагин osint_agent объявляет ai.invoke(*), а capability-гит
# считает «запрошено без scope» и «объявлено со scope» несравнимыми
# (gate/__init__.py::_is_covered). Поэтому роут запрашивает тот же scope.
#
# net.outbound — тот же host-glob, что объявляет plugin-владелец
# (extensions/osint_agent/plugin.toml): web-search ходит в Perplexity API.
[[route.capabilities]]
name = "net.inbound"
scope = "http:/api/v1/osint/*"
[[route.capabilities]]
name = "net.outbound"
scope = "*.perplexity.ai"

# ai.invoke — scope = workflow_id pattern или '*' (vocabulary, ADR-NEW-19).
[[route.capabilities]]
name = "ai.invoke"
scope = "*"

# ai.invoke покрывается плагином osint_agent: он объявляет ai.invoke(*)
# и net.outbound(*.perplexity.ai) в своём plugin.toml. Capability-гит требует
# route.capabilities ⊆ union(requires_plugins.capabilities) ∪ public, поэтому
# без requires_plugins маршрут отклонялся.
#
# ВНИМАНИЕ (TOML): в конверте [route] bare-ключи обязаны идти ДО любой
# вложенной таблицы — иначе они поглощаются последней открытой таблицей.
[route.requires_plugins]
osint_agent = ">=0.1,<1.0"

[route.transport]
default_timeout_s = 30.0

[route.feature_flags]
default = ["default"]
