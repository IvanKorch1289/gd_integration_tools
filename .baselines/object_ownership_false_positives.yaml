      применим. Волна 20, ADR-0398 (исполнение BPMN-веток gateway).
    owner: gd_integration_tools/dsl
    review_date: "2027-04-29"
    added_at: "2026-10-29"
  - file: src/backend/dsl/workflow/bpmn_importer.py
    line: 521
    reason: >
      ``elements.get(target_id)`` — та же локальная карта разобранного BPMN-XML
      (см. запись выше): поиск целевого узла по id в процессе импорта, без
