name: kyc_aml_check
version: "1.0"
description: |
  KYC/AML Check — 3 parallel checks → consolidate → decide (saga compensation).
  Template tags: kyc, aml, compliance, parallel, saga.
steps:
  # Activity-имена — зарегистрированные actions ядра (ADR-0398).
  - type: saga
    forward:
      - name: users.get
        args: {key: id, value: 0}
        timeout_s: 60
      - name: web_search.query
        args: {query: "sanctions screening", max_results: 5}
        timeout_s: 60
      - name: web_search.query
        args: {query: "pep screening", max_results: 5}
        timeout_s: 60
    compensate:
      - name: users.update
        args:
          key: id
          value: 0
          data: {status: revoked}
        timeout_s: 30
  - type: activity
    name: dq.stats
    args:
      dataset: kyc
    timeout_s: 30
  - type: activity
    name: dq.check
    args:
      data: {}
      dataset: kyc
    timeout_s: 30
