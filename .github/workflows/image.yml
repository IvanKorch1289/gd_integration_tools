name: image

# Sprint 6 Devops: container image pipeline — buildx + cosign + Trivy + GHCR.
# Template-only, working pipeline. Single-arch (linux/amd64); multi-arch —
# дорожная карта вне scope этой задачи (Sprint 6 W1).
#
# Triggers:
#   * push to master            — полный pipeline (build → scan → sign → push);
#   * tag v*.*.*                — release build с тем же pipeline;
#   * pull_request              — build + scan (sign/push пропускаются через if);
#   * workflow_dispatch         — manual run для ad-hoc верификаций.
#
# Pipeline ordering (явные needs — защита от регрессий в test_image_workflow.py):
#   build ──► scan ──► sign ──► push
#   scan   блокирует push (exit-code: 1 на HIGH/CRITICAL);
#   sign   блокирует push (push не стартует без подписи);
#   push   и sign пропускаются на PR (нет права писать в GHCR/PR).
#
# Идемпотентность: GHA cache (type=gha) используется в обоих buildx-шагах
# (build + push) — второй build переиспользует слои из первого, ~5x быстрее
# cold-cache. Cosign keyless (OIDC) — без long-lived секретов в репо.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # checkout
  packages: write         # push в ghcr.io
  id-token: write         # cosign keyless (OIDC ↔ Fulcio)
  security-events: write  # SARIF upload в Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (docker buildx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load to local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}

  scan:
    name: Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image: ${{ needs.build.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  sign:
    name: Sign (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --output-signature image.sig \
            --output-certificate image.pem \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Upload signature artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosign-signature-${{ github.ref_name }}
          path: |
            image.sig
            image.pem
          retention-days: 30
          if-no-files-found: warn

  push:
    name: Push (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, sign]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ops/compose/Dockerfile
          push: true
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ needs.build.outputs.image }}
          labels: ${{ needs.build.outputs.labels }}